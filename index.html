    let len = R.range(0.052, 0.115) * (0.72 + 0.5*Math.abs(Math.cos(az-1.1)));
    len = Math.min(len, Math.max(0.020, reach - rT*0.55));
    const NP = 9;
    const pts=[], rad=[];
    // ring 0 is a near-point buried INSIDE the trunk. never start a tube bare.
    pts.push(new THREE.Vector3(base.x - cx*rT*0.80, base.y + 0.004, base.z - cz*rT*0.80));
    rad.push(rr0*0.10);
    pts.push(new THREE.Vector3(base.x + cx*rT*0.30, base.y + 0.004, base.z + cz*rT*0.30));
    rad.push(rr0*0.92);
    for (let k=1;k<NP;k++){
      const u = (k-1)/(NP-2);
      // a root that arches above the soil leaves daylight under it. the
      // centreline sinks so the lower half of every root is buried.
      // centreline: arch only a hair above the surface, then sink so the
      // lower half of every root disappears into the soil
      const rise = Math.sin(u*Math.PI)*R.range(0.0006,0.0018)
                 - Math.pow(u,0.9)*rr0*0.90
                 - Math.pow(u,1.4)*R.range(0.010,0.020);
      const spread = 1.0 + Math.sin(u*2.3)*0.16;
      const wobble = (fbm3(u*4.0+i*13.0, 3.1, 7.7, 3)-0.5)*0.010;
      const azk = az + (fbm3(u*3.0+i*7.0, 1.3, 2.9, 2)-0.5)*0.55;
      const yy = base.y + rise + (u>0.55 ? -(u-0.55)*R.range(0.008,0.016) : 0.0);
      pts.push(new THREE.Vector3(
        base.x + Math.cos(azk)*(rT*0.55 + len*u*spread) + wobble,
        Math.max(yy, ROOT_DEEPEST),
        base.z + Math.sin(azk)*(rT*0.55 + len*u*spread) + wobble*0.7
      ));
      rad.push(rr0 * (1.0 - Math.pow(u,0.85)*0.80) * (1.0 + Math.sin(u*7.0+i)*0.10));
    }
    pushStrand(pts, rad, trunkS(t0), trunkC(t0), 1, 13, 'root',
      { crotch:1.0, parentR:rT });
    // one or two secondary surface roots
    const nsub = R.int(1,2);
    for (let q=0;q<nsub;q++){
      const at = R.range(0.30,0.66);
      const bi = Math.max(1, Math.min(NP-2, Math.round(at*(NP-1))));
      const p0 = pts[bi];
      const pr = rad[bi];
      const az2 = az + R.sign()*R.range(0.45, 1.05);
      const l2 = Math.min(len*R.range(0.35,0.62),
                          Math.max(0.010, maxRootReach(az2) - p0.length()));
      const sp=[], sr2=[];
      const pdir = new THREE.Vector3().subVectors(pts[Math.min(NP-1,bi+1)], pts[bi-1]).normalize();
      const outw = new THREE.Vector3(Math.cos(az2), -0.25, Math.sin(az2)).normalize();
      sp.push(new THREE.Vector3().copy(p0)
        .addScaledVector(pdir, -pr*0.25).addScaledVector(outw, -pr*1.15));
      sr2.push(pr*0.13);
      for(let k=0;k<6;k++){
        const u=k/5;
        sp.push(new THREE.Vector3(
          p0.x + Math.cos(az2)*l2*u,
          Math.max(p0.y - Math.pow(u,1.4)*R.range(0.008,0.018) + Math.sin(u*Math.PI)*0.003, ROOT_DEEPEST),
          p0.z + Math.sin(az2)*l2*u));
        sr2.push(pr*0.62*(1.0-Math.pow(u,0.8)*0.85));
      }
      pushStrand(sp, sr2, trunkS(t0)+0.02, trunkC(t0)+2e4, 2, 8, 'root', {crotch:1.0, parentR:pr});
    }
  }

  /* ---------- 3. PRIMARY BRANCHES ----------------------------------------- */
  /* nine branches, unevenly spaced. eleven evenly spaced ones read as a stack. */
const BR_T = [0.213, 0.302, 0.378, 0.468, 0.546, 0.638, 0.722, 0.812, 0.900];
  const FRONT_AZ = Math.PI * 0.5;    // local +Z is the viewing front
  const usedAz = [];
  const branches = [];
  for (let bi=0; bi<BR_T.length; bi++){
    const t = BR_T[bi] + R.range(-0.020, 0.020);
    let az = bendAz(t) + R.gauss()*0.30;
    // rotate away from the front, and away from the last two branches
    for (let tries=0; tries<28; tries++){
      let ok = true;
      let df = Math.abs(((az - FRONT_AZ + Math.PI*3)%TAU) - Math.PI);
      const frontGuard = bi < 6 ? 0.62 : 0.34;
      if (df < frontGuard) ok = false;
      for (let k=Math.max(0,usedAz.length-2); k<usedAz.length; k++){
        let d = Math.abs(((az - usedAz[k] + Math.PI*3)%TAU) - Math.PI);
        if (d < 1.62) { ok = false; break; }
      }
      if (ok) break;
      az += 1.05 + R.range(0,0.42);
    }
    usedAz.push(az);

    const rT = trunkRAt(t);
    const base = new THREE.Vector3(); trunkAt(t, base);
    const len = (0.155*Math.pow(1.0-t, 0.76) + 0.026) * R.range(0.84, 1.14);
    const r0  = rT * (0.52 - 0.16*t) * R.range(0.90,1.10);
    // every branch leaves at its own angle. uniform rise and droop is what
    // makes a tree read as a stack of plates.
    const droop = lerp(0.34, 0.10, t) * R.range(0.62, 1.42);
    const rise  = lerp(0.15, 0.38, t) * R.range(0.55, 1.55);

    // branch centreline: three direction changes in plan, flatten then droop
    const NB = 26;
    const pts=[], rad=[];
    const cx=Math.cos(az), cz=Math.sin(az);
    const perpx=-cz, perpz=cx;
    const tang = trunkTangent(t, new THREE.Vector3());
    let shaftD0 = rT*1.35;   // where the emergence hands over to the shaft
    /* Emergence. Every ring is placed by SOLVING one invariant rather than by
       guessing fractions of rT:

           d + rho  <=  rT - displacementMargin

       d is distance from the TRUNK AXIS, rho is the ring radius, and the
       margin is however deep the bark displacement cuts here. Break it and
       the branch's own surface crosses the trunk's and you get a wedge you
       can see into. Fixed fractions cannot hold it, because r0/rT and the
       margin/rT ratio both change as you go up the trunk.

       There is deliberately NO collar swelling. A collar that swells before
       it clears the wall breaks the invariant by definition — that was the
       original bug. The tube reaches full caliper while still fully buried,
       then runs out through the wall almost cylindrically. A near side that
       advances exactly as fast as the tube is just a cylinder; a near side
       that advances FASTER is a reversed cone, and that is the cut. */
    const dispM = Math.min(0.0024, rT*0.115);
    const rho2 = r0*0.96;
    // solved with slack, so the lobed flare and float error cannot tip it over
    const d2 = Math.min(0.30*rT, rT - dispM*1.30 - rho2*1.04);  // last buried ring
    const rho1 = r0*0.55;
    const d1 = Math.min(-0.10*rT, d2 - 0.42*rT);
    const d0 = d1 - 0.62*rT;
    const rho3 = r0*1.05;
    const d3 = d2 + 0.52*rT;                            // carries it through
    shaftD0  = d3 + 0.48*rT;
    const EM = [ [d0, r0*0.06, -0.05], [d1, rho1, -0.02],
                 [d2, rho2, 0.01], [d3, rho3, 0.04] ];
    for (let e=0;e<EM.length;e++){
      pts.push(new THREE.Vector3(
        base.x + cx*EM[e][0] - tang.x*rT*0.05,
        base.y + rT*EM[e][2] - tang.y*rT*0.05,
        base.z + cz*EM[e][0] - tang.z*rT*0.05));
      rad.push(Math.max(0.0004, EM[e][1]));
    }
    const swing = [0.0, R.range(0.10,0.20), -R.range(0.13,0.24), R.range(0.06,0.15), -R.range(0.03,0.09)];
    const yph = R.range(0, TAU), yamp = R.range(0.06, 0.15);
    for (let k=1;k<NB;k++){
      const u=(k-1)/(NB-2);
      const lat = (
        Math.sin(u*3.05)*swing[1] + Math.sin(u*6.1+1.1)*swing[2] +
        Math.sin(u*9.6+2.3)*swing[3] + Math.sin(u*13.0+0.6)*swing[4]) * len * 0.52;
      const yy = base.y + Math.sin(Math.min(u*1.55,1.0)*Math.PI*0.5)*len*rise
                        - Math.pow(u,2.3)*len*droop
                        + Math.sin(u*5.1 + yph)*len*yamp*u;
      const rr = shaftD0 + len*u;
      pts.push(new THREE.Vector3(
        base.x + cx*rr + perpx*lat,
        yy,
        base.z + cz*rr + perpz*lat));
      rad.push(Math.max(0.0007, r0 * Math.pow(1.0-u, 0.62) * (1.0 - u*0.10) + 0.0006));
    }
    const wire = (bi===1 || bi===4) ? 1.0 : 0.0;
    const st = pushStrand(pts, rad, trunkS(t), trunkC(t), 1, bi<4?13:10, 'branch',
      { crotch:1.0, parentR:rT, wire,
        junction: { axis: base.clone(), dir: new THREE.Vector3(cx, 0, cz), rT } });
    branches.push({ st, pts, rad, az, len, t, r0, bi });
  }

  /* ---------- 4. PADS ------------------------------------------------------ */
  for (let bi=0; bi<branches.length; bi++){
    const b = branches[bi];
    const n = b.pts.length;
    const cIdx = Math.round(n*0.80);
    const c = b.pts[cIdx].clone();
    const tip = b.pts[n-1];
    const dir = new THREE.Vector3().subVectors(tip, b.pts[Math.round(n*0.45)]);
    dir.y *= 0.25; dir.normalize();
    c.addScaledVector(dir, b.len*0.11);
    const scale = lerp(1.0, 0.46, b.t);
    // 大中小: every pad gets its own size class, so the canopy reads as
    // clusters of different ages instead of eleven identical clouds
    const sizeVar = R.range(0.60, 1.42);
    // a pad is a flattened slab wrapped around the OUTER HALF of the branch,
    // not a ball centred on its tip. built any other way it rejects the very
    // sub-branches that are supposed to fill it.
    const i0 = Math.round(n*0.40);
    const spine = [];
    for (let i=i0;i<n;i++) spine.push(b.pts[i].clone());
    spine.push(tip.clone().addScaledVector(dir, b.len*0.13));
    let spineLen = 0;
    for (let i=1;i<spine.length;i++) spineLen += spine[i].distanceTo(spine[i-1]);
    const pad = {
      c, dir, spine, spineLen, branch: bi,
      // rad:ey near 2:1. push it past 3:1 and every pad reads as a pancake.
      rad: (b.len*0.360*scale + 0.013) * sizeVar,
      ey:  (0.0210 + 0.0160*(1.0-b.t)) * lerp(0.82, 1.28, R()),   // foliage reads as round clumps, as in the reference
      ex:  (b.len*0.360*scale + 0.013) * sizeVar,
      ez:  (b.len*0.360*scale + 0.013) * sizeVar,
      phase: R.range(0, TAU),
      lobeA: R.range(0.20, 0.34),
      tips: [], budget: 0
    };
    TREE.pads.push(pad);
  }
  // apex crown pad
  {
    const apex = tp[NT-1].clone();
    const c = apex.clone().add(new THREE.Vector3(0.004,0.010,0.004));
    const pad = { c, dir:new THREE.Vector3(0,1,0),
      spine:[c.clone().add(new THREE.Vector3(0,-0.012,0)), c.clone(), c.clone().add(new THREE.Vector3(0,0.012,0))],
      spineLen:0.024, rad:0.050*R.range(0.88,1.22), ey:0.024*lerp(0.85,1.20,R()), ex:0.050*R.range(0.88,1.22), ez:0.050*R.range(0.88,1.22),
      phase:R.range(0,TAU), lobeA:0.26,
      branch:-1, tips:[], budget:0 };
    TREE.pads.push(pad);
  }
  // push overlapping pads apart so there is real air between them
  for (let iter=0; iter<24; iter++){
    for (let i=0;i<TREE.pads.length;i++) for (let j=i+1;j<TREE.pads.length;j++){
      const A=TREE.pads[i], B=TREE.pads[j];
      const dy = Math.abs(A.c.y-B.c.y);
      const need = (A.ey+B.ey)*1.30 + 0.016;
      const dxz = Math.hypot(A.c.x-B.c.x, A.c.z-B.c.z);
      const needXZ = (Math.max(A.ex,A.ez)+Math.max(B.ex,B.ez))*0.62;
      if (dy < need && dxz < needXZ){
        const push = (need - dy)*0.5 + 0.0008;
        const s = A.c.y < B.c.y ? -1 : 1;
        A.c.y += s*push*0.5; B.c.y -= s*push*0.5;
      }
    }
  }
  for (let i=0;i<TREE.pads.length;i++){
    const p = TREE.pads[i];
    // tips per pad scale with the pad's actual volume, so the low branches
    // carry the mass and the apex stays fine
    const vol = p.rad * p.ey * (p.spineLen + p.rad) * 2.6;
    p.budget = Math.round(clamp(vol*4.8e5, 70, 430));
  }

  /* ---------- 5. SUB-BRANCHES + RAMIFICATION ------------------------------ */
  const MINSEP = 0.0060;
  /* A pad is measured in plan against the branch spine, and in section against
     a lens profile: deepest over the branch, feathering to nothing at the
     margin. Tapered along the spine and lobed in plan, because a pad seen from
     above has bays and promontories, not a smooth ellipse. Built as a plain
     ellipsoid it reads as a pancake, and a stack of pancakes is the failure
     state this whole section exists to avoid. */
  const _pm2 = { dxz:0, y:0, t:0 };
  function padMetric(pad, p, out){
    let best = 1e18, by = pad.c.y, bt = 0;
    for (let i=0;i<pad.spine.length-1;i++){
      const A = pad.spine[i], B = pad.spine[i+1];
      const ax = B.x-A.x, az = B.z-A.z;
      const ll = ax*ax + az*az;
      const t = ll < 1e-12 ? 0 : clamp(((p.x-A.x)*ax + (p.z-A.z)*az)/ll, 0, 1);
      const cx = A.x + ax*t, cz = A.z + az*t;
      const d2 = (p.x-cx)*(p.x-cx) + (p.z-cz)*(p.z-cz);
      if (d2 < best){ best = d2; by = A.y + (B.y-A.y)*t; bt = (i+t)/(pad.spine.length-1); }
    }
    out.dxz = Math.sqrt(best); out.y = by; out.t = bt;
    return out;
  }
  function padRadAt(pad, p, t){
    const az = Math.atan2(p.z - pad.c.z, p.x - pad.c.x);
    const lobe = 1.0 + pad.lobeA*Math.sin(az*3.0 + pad.phase)
                     + pad.lobeA*0.46*Math.sin(az*5.0 - pad.phase*1.7);
    return pad.rad * (1.0 - 0.40*t*t) * lobe;
  }
  function padDist(pad, p){
    padMetric(pad, p, _pm2);
    return _pm2.dxz;
  }
  function padContains(pad, p, slack){
    padMetric(pad, p, _pm2);
    const rad = padRadAt(pad, p, _pm2.t);
    if (_pm2.dxz > rad + slack) return false;
    const k = sat(_pm2.dxz/(rad + 1e-6));
    let eyHere = pad.ey * (0.25 + 0.75*Math.sqrt(Math.max(0.0, 1.0 - k*k)));
    // ragged top and bottom. a perfectly smooth section reads as sheet metal.
    eyHere *= 1.0 + 0.34*Math.sin(p.x*46.0 + pad.phase)*Math.cos(p.z*39.0 - pad.phase*1.6)
                  + 0.16*Math.sin(p.z*71.0 + pad.phase*2.3);
    return Math.abs(p.y - _pm2.y) <= eyHere + slack*0.55;
  }
  /* Every shoot is given its own level inside the pad. Steer them all at one
     surface and the pad collapses to a single sheet of flowers no matter how
     thick you make the containment volume — which is exactly how a pad turns
     into a pancake. */
  function padTargetY(pad, p, yb){
    padMetric(pad, p, _pm2);
    const k = sat(_pm2.dxz/(padRadAt(pad, p, _pm2.t) + 1e-6));
    const crown = pad.ey*0.24*(1.0 - k*k);
    const level = yb * pad.ey * 0.72 * (0.35 + 0.65*Math.sqrt(Math.max(0.0,1.0-k*k)));
    return _pm2.y + crown + level;
  }
  function tipOK(pad, p){
    if (!padContains(pad, p, 0.006)) return false;
    for (let i=0;i<pad.tips.length;i++){
      const q = pad.tips[i];
      const dx=q.x-p.x, dy=(q.y-p.y)*1.9, dz=q.z-p.z;
      if (dx*dx+dy*dy+dz*dz < MINSEP*MINSEP) return false;
    }
    return true;
  }

  /* one zigzag twig strand: 3-5 internodes, direction kinks at every node,
     alternating. this is the cultivar's signature and it costs nothing. */
  function twigStrand(p0, dir0, r0, order, pad, sStart, cStart, zig0, parentR, parentDir, yb){
    const nInt = order <= 3 ? R.int(3,4) : R.int(2,3);
    const kink = lerp(0.74, 0.32, sat((order-2)/4));
    // kojo-no-mai internodes are 5 to 15 mm. anything longer and a single
    // strand walks straight out of the pad it is supposed to fill.
    const iLen = lerp(0.0132, 0.0046, sat((order-2)/4)) * R.range(0.80, 1.22);
    const up = new THREE.Vector3(0,1,0);
    const pts=[], rad=[];
    // buried starting ring
    // p0 already sits on the parent's surface, so backing up along the PARENT
    // axis leaves the start ring on that surface. It has to go inward, along
    // the twig's own direction reversed, or the tube opens into daylight.
    const pd = parentDir ? parentDir : dir0;
    pts.push(new THREE.Vector3().copy(p0)
      .addScaledVector(pd, -parentR*0.30).addScaledVector(dir0, -parentR*1.20));
    rad.push(r0*0.12);
    pts.push(new THREE.Vector3().copy(p0).addScaledVector(dir0, -parentR*0.40));
    rad.push(r0*0.70);
    pts.push(p0.clone()); rad.push(r0*1.16);   // collar
    let d = dir0.clone().normalize();
    let zig = zig0;
    let cur = p0.clone();
    let rr = r0;
    for (let k=0;k<nInt;k++){
      const side = new THREE.Vector3().crossVectors(d, up);
      if (side.lengthSq() < 1e-8) side.set(1,0,0);
      side.normalize();
      const a = kink * R.range(0.72, 1.28) * zig;
      const nd = d.clone().addScaledVector(side, Math.tan(a*0.5)*1.30);
      // flatten toward the pad plane, and pull gently toward the pad centre
      nd.y = nd.y*0.34 + (pad ? (padTargetY(pad, cur, yb||0) - cur.y)*1.15 : 0) + R.gauss()*0.075;
      if (pad && padDist(pad, cur) > pad.rad*0.55){
        const toC = new THREE.Vector3().subVectors(pad.c, cur);
        if (toC.lengthSq() > 1e-10) nd.addScaledVector(toC.normalize(), 0.22);
      }
      nd.normalize();
      const L = iLen * (1.0 - k*0.10);
      cur = cur.clone().addScaledVector(nd, L);
      rr *= R.range(0.86, 0.93);
      pts.push(cur.clone()); rad.push(Math.max(0.00034, rr));
      d = nd; zig = -zig;
    }
    const radial = order <= 2 ? 8 : (order === 3 ? 6 : (order === 4 ? 5 : 4));
    const st = pushStrand(pts, rad, sStart, cStart, order, radial, 'twig',
      { crotch:1.0, parentR });
    return { st, endPos: cur, endDir: d, endR: rad[rad.length-1], zig };
  }

  let totalTips = 0;
  function terminate(pad, seg, st, order){
    pad.tips.push(seg.endPos.clone());
    totalTips++;
    // terminal umbel — prunus incisa carries one to three flowers per spur
    /* An umbel sits ON the shoot apex. Scattering the pedicel bases up to
       8 mm off a 0.5 mm twig left flowers hanging in mid-air with a visible
       stalk going nowhere — the jitter has to be bounded by the twig itself,
       and the base seated slightly INSIDE it. */
    const rTip = Math.max(0.0004, st.radii[st.radii.length-1]);
    const nf = R.int(2,3);
    for (let q=0;q<nf;q++){
      const az=R.range(0,TAU);
      const off=new THREE.Vector3(Math.cos(az)*rTip*R.range(0.0,0.55),
                                  -rTip*R.range(0.0,0.40),
                                  Math.sin(az)*rTip*R.range(0.0,0.55));
      const fd = new THREE.Vector3(Math.cos(az)*0.75, R.range(-0.08, 0.72), Math.sin(az)*0.75).normalize();
      const base = seg.endPos.clone().addScaledVector(seg.endDir, -rTip*1.7).add(off);
      TREE.flowers.push({ pos: base, dir: fd,
        c: st.cEnd, w: 0, seed:R(), order: order+1 });
    }
    if (R.chance(0.055)){
      TREE.leaves.push({ pos: seg.endPos.clone(), dir: seg.endDir.clone(),
        c: st.cEnd, w: 0, seed:R() });
    }
  }

  /* every shoot tip carries at least one flower. intermediate twigs whose
     children were queued used to bloom only by chance, and their bare tips
     poked out of the pads as whiskers. one seated bloom per tip buries them. */
  function tipFlower(seg, st, order){
    const rTip = Math.max(0.0004, st.radii[st.radii.length-1]);
    const az = R.range(0,TAU);
    const off = new THREE.Vector3(Math.cos(az)*rTip*0.45, -rTip*0.30, Math.sin(az)*rTip*0.45);
    const fd = new THREE.Vector3(Math.cos(az)*0.75, -R.range(0.35,0.95), Math.sin(az)*0.75).normalize();
    const base = seg.endPos.clone().addScaledVector(seg.endDir, -rTip*1.7).add(off);
    TREE.flowers.push({ pos: base, dir: fd, c: st.cEnd, w: 0, seed: R(), order: order+1 });
  }

  /* flower spurs on the previous year's wood: kojo-no-mai blooms along the
     shoot, not only at its tip */
  function spurFlowers(st, order){
    if (order < 3) return;
    for (let k=1;k<st.pts.length-1;k++){
      if (!R.chance(order>=4 ? 0.75 : 0.45)) continue;
      const az = R.range(0,TAU);
      const nrm = new THREE.Vector3(Math.cos(az),0,Math.sin(az));
      const dseg = new THREE.Vector3().subVectors(st.pts[k+1], st.pts[k]).normalize();
      nrm.addScaledVector(dseg, -nrm.dot(dseg));
      if (nrm.lengthSq() < 1e-10) continue;
      nrm.normalize();
      // seated inside the twig surface, never floating off it
      const pos = st.pts[k].clone().addScaledVector(nrm, st.radii[k]*0.72);
      // blooms face outward off the shoot, tipping skyward — a cherry never
      // hangs its face at the soil
      const fd = nrm.clone().multiplyScalar(0.85);
      fd.y += R.range(-0.12, 0.60);
      fd.normalize();
      TREE.flowers.push({ pos, dir: fd, c: st.comp[k], w: 0, seed: R(), order });
    }
  }

  /* Breadth-first growth. Depth-first recursion prunes unevenly — one lucky
     branch races to the pad margin and starves the rest — so the canopy comes
     out sparse and lopsided no matter how the budget is tuned. A queue fills
     the pad evenly and stops at exactly the density asked for. */
  function growPad(pad, seeds, depthMax){
    const q = seeds.slice();
    const up = new THREE.Vector3(0,1,0);
    let guard = 0;
    while (q.length && pad.tips.length < pad.budget && guard++ < 30000){
      const n = q.shift();
      const seg = twigStrand(n.pos, n.dir, n.r, n.order, pad, n.s, n.c, n.zig, n.parentR, n.parentDir, n.yb);
      spurFlowers(seg.st, n.order);
      if (R.chance(0.80)) tipFlower(seg, seg.st, n.order);
      if (n.order >= depthMax){ terminate(pad, seg, seg.st, n.order); continue; }
      // fewer forks: one clean continuation plus at most one side shoot.
      // a fork at every node is what turns a pad into a ball of chicken wire.
      const nk = n.order <= 3 ? (R.chance(0.30) ? 3 : 2) : 2;
      const side = new THREE.Vector3().crossVectors(seg.endDir, up);
      if (side.lengthSq() < 1e-8) side.set(1,0,0);
      side.normalize();
      let z = seg.zig, grew = 0;
      const spread = lerp(0.92, 0.54, sat((n.order-2)/4));
      for (let k=0;k<nk;k++){
        let placed = false;
        for (let attempt=0; attempt<3 && !placed; attempt++){
          const a = (k-(nk-1)*0.5)*spread*R.range(0.74,1.28) + (attempt ? R.gauss()*0.52 : 0.0);
          const yb = clamp((n.yb||0) + R.gauss()*0.52, -1.0, 1.0);
          const nd = seg.endDir.clone().addScaledVector(side, Math.tan(a*0.5)*1.4);
          nd.y = nd.y*0.42 + R.gauss()*0.13
               + (padTargetY(pad, seg.endPos, yb) - seg.endPos.y)*1.25;
          if (nd.lengthSq() < 1e-10) continue;
          nd.normalize();
          const probe = seg.endPos.clone().addScaledVector(nd, 0.012);
          if (!padContains(pad, probe, 0.012)) continue;
          if (n.order+1 >= depthMax && !tipOK(pad, probe)) continue;
          q.push({ pos: seg.endPos.clone(), dir: nd, r: seg.endR*R.range(0.74,0.88),
                   order: n.order+1, s: seg.st.sEnd, c: seg.st.cEnd, zig: z, yb: yb,
                   parentR: seg.endR, parentDir: seg.endDir.clone() });
          placed = true; grew++;
        }
        z = -z;
      }
      if (!grew) terminate(pad, seg, seg.st, n.order);
    }
    // everything still queued becomes the outer edge of the pad, so the
    // silhouette is finished rather than cut off mid-shoot
    for (let i=0;i<q.length;i++){
      const n = q[i];
      // respect the separation rule on the way out too, or the leftovers all
      // land on the margin at once and the pad grows a dense white rim
      if (!tipOK(pad, n.pos)) continue;
      const seg = twigStrand(n.pos, n.dir, n.r, n.order, pad, n.s, n.c, n.zig, n.parentR, n.parentDir, n.yb);
      spurFlowers(seg.st, n.order);
      terminate(pad, seg, seg.st, n.order);
    }
  }

  // sub-branches along the outer half of each primary, then grow the pad
  for (let bi=0; bi<branches.length; bi++){
    const b = branches[bi];
    const pad = TREE.pads[bi];
    const n = b.pts.length;
    const depthMax = bi < 7 ? 5 : 4;
    const nsub = bi < 4 ? 7 : (bi < 7 ? 5 : 4);
    const seeds = [];
    for (let q=0; q<nsub; q++){
      // never in the inner 42%: the branch must stay readable as a line
      const u = 0.42 + (q/(nsub))*0.54 + R.range(-0.020,0.020);
      const idx = clamp(Math.round(u*(n-1)), 2, n-2);
      const p0 = b.pts[idx].clone();
      const pr = b.rad[idx];
      const bdir = new THREE.Vector3().subVectors(b.pts[idx+1], b.pts[idx-1]).normalize();
      const up = new THREE.Vector3(0,1,0);
      const sideV = new THREE.Vector3().crossVectors(bdir, up).normalize();
      const sgn = (q%2===0)? 1 : -1;
      const nd = bdir.clone().addScaledVector(sideV, sgn*R.range(0.52,0.95));
      nd.y = nd.y*0.5 + R.range(0.04,0.26);
      nd.normalize();
      seeds.push({ pos: p0.addScaledVector(nd, pr*0.30), dir: nd,
                   r: pr*R.range(0.52,0.70), order: 2,
                   s: b.st.sArc[idx], c: b.st.comp[idx], zig: sgn,
                   yb: R.range(-0.72, 0.72),
                   parentR: pr, parentDir: bdir });
    }
    // the branch's own extension carries the outer edge of the pad
    const tipDir = new THREE.Vector3().subVectors(b.pts[n-1], b.pts[n-3]).normalize();
    seeds.push({ pos: b.pts[n-1].clone(), dir: tipDir, r: b.rad[n-1]*0.85, order: 2,
                 s: b.st.sEnd, c: b.st.cEnd, zig: 1, yb: R.range(-0.4, 0.4),
                 parentR: b.rad[n-1], parentDir: tipDir });
    growPad(pad, seeds, depthMax);
  }
  // apex crown
  {
    const pad = TREE.pads[TREE.pads.length-1];
    const apexDir = new THREE.Vector3().subVectors(tp[NT-1], tp[NT-6]).normalize();
    const seeds = [];
    for (let q=0;q<7;q++){
      const az = R.range(0,TAU);
      const nd = apexDir.clone();
      nd.x += Math.cos(az)*R.range(0.35,0.85);
      nd.z += Math.sin(az)*R.range(0.35,0.85);
      nd.y = Math.abs(nd.y)*0.7 + 0.22;
      nd.normalize();
      seeds.push({ pos: tp[NT-1].clone().addScaledVector(nd, TRUNK_R_APEX*0.4), dir: nd,
                   r: TRUNK_R_APEX*R.range(0.62,0.80), order: 2,
                   s: trunkStrand.sEnd, c: trunkStrand.cEnd, zig: q%2?1:-1,
                   yb: R.range(-0.7, 0.7),
                   parentR: TRUNK_R_APEX, parentDir: apexDir });
    }
    growPad(pad, seeds, 4);
  }

  /* ---------- 6. NORMALISE THE COMPLIANCE WEIGHT --------------------------- */
  let cMax = 1e-6;
  for (let i=0;i<TREE.strands.length;i++) cMax = Math.max(cMax, TREE.strands[i].cEnd);
  TREE.cMax = cMax;
  _cRef = cMax;
  for (let i=0;i<TREE.flowers.length;i++) TREE.flowers[i].w = compToWeight(TREE.flowers[i].c);
  for (let i=0;i<TREE.leaves.length;i++)  TREE.leaves[i].w  = compToWeight(TREE.leaves[i].c);
  TREE.stats = {
    strands: TREE.strands.length,
    tips: totalTips,
    pads: TREE.pads.length,
    flowerSites: TREE.flowers.length,
    leafSites: TREE.leaves.length,
    cMax
  };
  return TREE;
}

/* Compliance -> sway weight. Monotone, continuous across every joint by
   construction (it is an integral along the path), and identically zero on the
   trunk. This single scalar is the ONLY structural quantity the vertex shader
   is allowed to see. */
let _cRef = 5.0e8;
function compToWeight(c){
  const cn = Math.pow(sat(c/_cRef), 0.30);
  return smooth(0.20, 0.95, cn);
}

/* ============================================================================
   SECTION 06 — WOOD MESH + BARK SHADER
   Every strand is a swept tube whose first ring is a near-point buried inside
   its parent, so no child ever shows a bare open cylinder at a shallow angle.
   Bark is authored in tube UV: u wraps, v runs along, which is the only way
   "horizontal" lenticels stay horizontal when a branch points sideways.
   ========================================================================= */

const BARK_PU = 8, BARK_PV = 16;

/* the exact expression the bark texture's height channel was baked from, so
   CPU displacement and GPU shading agree on where a furrow is */
function barkFissure(u, v){
  const fx = u*BARK_PU, fy = v*BARK_PV;
  const warp  = (pfbm2(fx*0.9, fy*0.9, BARK_PU, BARK_PV, 3)-0.5)*0.65;
  const cell  = pworley(fx*3.0 + warp*3.0, fy*3.0 + warp*3.0, BARK_PU*3, BARK_PV*3);
  let f = Math.pow(sat(1.0 - cell.edge/0.19), 1.55);
  const crack = Math.pow(sat(pridge2(fx*6.5+warp*2.0, fy*2.6, BARK_PU*6, BARK_PV*3, 3)-0.55)*2.4, 1.7);
  return sat(f*0.90 + crack*0.22);
}

/* ---- spatial grid over strand starts, for crotch occlusion --------------- */
function buildCrotchGrid(){
  const cell = 0.020;
  const map = new Map();
  const pts = [];
  for (let i=0;i<TREE.strands.length;i++){
    const st = TREE.strands[i];
    if (st.kind === 'trunk') continue;
    const p = st.pts[1] || st.pts[0];
    pts.push({ p, r: Math.max(st.parentR, st.radii[1]||st.radii[0]) });
  }
  for (let i=0;i<pts.length;i++){
    const p = pts[i].p;
    const k = ((p.x/cell)|0) + ',' + ((p.y/cell)|0) + ',' + ((p.z/cell)|0);
    let a = map.get(k); if (!a){ a=[]; map.set(k,a); }
    a.push(pts[i]);
  }
  return {
    query(x,y,z){
      const ix=(x/cell)|0, iy=(y/cell)|0, iz=(z/cell)|0;
      let occ = 0;
      for (let dz=-1;dz<=1;dz++) for (let dy=-1;dy<=1;dy++) for (let dx=-1;dx<=1;dx++){
        const a = map.get((ix+dx)+','+(iy+dy)+','+(iz+dz));
        if (!a) continue;
        for (let i=0;i<a.length;i++){
          const q=a[i];
          const d = Math.hypot(x-q.p.x, y-q.p.y, z-q.p.z);
          const rad = q.r*1.7 + 0.003;
          if (d < rad) occ = Math.max(occ, 1.0 - d/rad);
        }
      }
      return occ;
    }
  };
}

/* --------------------------------------------------------------------------
   MESH
   -------------------------------------------------------------------------- */
function buildWoodGeometry(){
  const grid = buildCrotchGrid();
  let vTotal = 0, iTotal = 0;
  const meta = [];
  for (let i=0;i<TREE.strands.length;i++){
    const st = TREE.strands[i];
    const rings = st.pts.length + 1;          // +1 collapsed tip cap
    const radial = st.radial;
    const vc = rings*(radial+1);
    const ic = (rings-1)*radial*6;
    meta.push({ st, rings, radial, vOff:vTotal, iOff:iTotal, vc, ic });
    vTotal += vc; iTotal += ic;
  }

  const P = new Float32Array(vTotal*3);
  const N = new Float32Array(vTotal*3);
  const UV= new Float32Array(vTotal*2);
  const W = new Float32Array(vTotal);
  const IN= new Float32Array(vTotal*4);
  const RD= new Float32Array(vTotal);   // local caliper: parallax needs a scale
  const IDX = (vTotal > 65535) ? new Uint32Array(iTotal) : new Uint16Array(iTotal);

  const tmpN = new THREE.Vector3(), tmpB = new THREE.Vector3();
  const ringPos = [];                          // scratch for one ring

  for (let m=0;m<meta.length;m++){
    const M = meta[m], st = M.st;
    const n0 = st.pts.length;
    const rings = M.rings, radial = M.radial;
    const F = frames(st.pts);
    const isTrunk = st.kind === 'trunk';
    const isRoot  = st.kind === 'root';
    const orderN  = Math.min(st.order, 6)/6;

    // v runs along the branch at a rate that keeps texels roughly isotropic;
    // the effective radius is floored so twigs do not get microscopic bark.
    const vArr = new Float32Array(rings);
    vArr[0] = 0;
    for (let i=1;i<n0;i++){
      const ds = st.pts[i].distanceTo(st.pts[i-1]);
      const rEff = Math.max(0.0042, (st.radii[i]+st.radii[i-1])*0.5);
      vArr[i] = vArr[i-1] + ds/(4.0*Math.PI*rEff);
    }
    vArr[n0] = vArr[n0-1] + 0.01;

    const dispScale = isTrunk ? 0.115 : (st.order <= 1 ? 0.085 : 0.0);

    for (let i=0;i<rings;i++){
      const last = (i === n0);
      const src = last ? n0-1 : i;
      const c = st.pts[src];
      let r = last ? 0.00002 : st.radii[src];
      const T = F.T[src], Nv = F.N[src], Bv = F.B[src];
      const cx = last ? c.x + T.x*st.radii[src]*0.85 : c.x;
      const cy = last ? c.y + T.y*st.radii[src]*0.85 : c.y;
      const cz = last ? c.z + T.z*st.radii[src]*0.85 : c.z;

      const sA = last ? st.sArc[n0-1] : st.sArc[src];
      const cA = last ? st.comp[n0-1] : st.comp[src];
      const wgt = compToWeight(cA);
      const vv = vArr[i];

      // nebari lobes: the trunk base is not round, it flares toward each root
      let lobeAmp = 0;
      if (isTrunk && st.lobes){
        // measured from the SOIL line, not from the buried start ring
        const tt = Math.max(0, (src - (st.uOff||0))/(n0-1-(st.uOff||0)));
        lobeAmp = 0.30 * Math.exp(-tt*15.0);
      }
      const crotchAO = 1.0 - grid.query(cx,cy,cz)*0.62;

      // scar mask in (t, azimuth)
      for (let j=0;j<=radial;j++){
        const th = (j%radial)/radial * TAU;
        const ct = Math.cos(th), sth = Math.sin(th);
        let rr = r;
        if (lobeAmp > 0.001){
          // sum of gaussian lobes at the root azimuths, in the ring's own frame
          const wx = Nv.x*ct + Bv.x*sth, wz = Nv.z*ct + Bv.z*sth;
          const wa = Math.atan2(wz, wx);
          let lobe = 0;
          for (let k=0;k<st.lobes.length;k++){
            let d = Math.abs(((wa - st.lobes[k] + Math.PI*3)%TAU) - Math.PI);
            lobe = Math.max(lobe, Math.exp(-(d*d)/0.34));
          }
          rr *= 1.0 + lobeAmp*(lobe*0.95 - 0.22);
        }
        const u = j/radial;
        let px = cx + (Nv.x*ct + Bv.x*sth)*rr;
        let py = cy + (Nv.y*ct + Bv.y*sth)*rr;
        let pz = cz + (Nv.z*ct + Bv.z*sth)*rr;

        let scarM = 0;
        if (isTrunk && st.scar){
          const tt = Math.max(0, (src - (st.uOff||0))/(n0-1-(st.uOff||0)));
          const wx = Nv.x*ct + Bv.x*sth, wz = Nv.z*ct + Bv.z*sth;
          const wa = Math.atan2(wz, wx);
          for (let k=0;k<st.scar.length;k++){
            const sc = st.scar[k];
            const dt = (tt - sc.t)/0.052;
            let da = (((wa - sc.az + Math.PI*3)%TAU) - Math.PI)/0.62;
            const d2 = dt*dt + da*da;
            if (d2 < 1.0) scarM = Math.max(scarM, 1.0 - Math.sqrt(d2));
          }
        }

        // real displacement, not a normal map. depth is bounded well under the
        // burial depth of any child, so nothing ever separates at a joint.
        if (dispScale > 0 && !last){
          const f = barkFissure(u, vv);
          let d = -f * Math.min(0.0024, rr*dispScale);
          // healed scar: pulled flat, with a raised roll around it
          if (scarM > 0.001) d += (scarM > 0.55 ? -rr*0.10*(scarM-0.55)/0.45 : rr*0.055*scarM);
          // wire spiral, a shallow helical groove
          if (st.wire > 0){
            const hx = (vv*3.1 - u);
            const hf = Math.abs((hx - Math.floor(hx)) - 0.5);
            if (hf > 0.40) d -= rr*0.055*sat((hf-0.40)/0.10);
          }
          const nx=(Nv.x*ct+Bv.x*sth), ny=(Nv.y*ct+Bv.y*sth), nz=(Nv.z*ct+Bv.z*sth);
          px += nx*d; py += ny*d; pz += nz*d;
        }

        const vi = M.vOff + i*(radial+1) + j;
        P[vi*3+0]=px; P[vi*3+1]=py; P[vi*3+2]=pz;
        UV[vi*2+0]=u; UV[vi*2+1]=vv;
        RD[vi]=rr;
        W[vi]=wgt;
        IN[vi*4+0]=orderN;
        IN[vi*4+1]=crotchAO;
        IN[vi*4+2]=scarM;
        IN[vi*4+3]=st.wire;
      }
    }

    // analytic normals by central differences on the parametric surface
    for (let i=0;i<rings;i++){
      const i0 = Math.max(0,i-1), i1 = Math.min(rings-1,i+1);
      for (let j=0;j<=radial;j++){
        const jm = (j-1+radial)%radial, jp = (j+1)%radial;
        const a = M.vOff + i*(radial+1) + jp;
        const b = M.vOff + i*(radial+1) + jm;
        const c = M.vOff + i1*(radial+1) + (j%radial);
        const d = M.vOff + i0*(radial+1) + (j%radial);
        const tx = P[a*3]-P[b*3], ty = P[a*3+1]-P[b*3+1], tz = P[a*3+2]-P[b*3+2];
        const sx = P[c*3]-P[d*3], sy = P[c*3+1]-P[d*3+1], sz = P[c*3+2]-P[d*3+2];
        let nx = ty*sz - tz*sy, ny = tz*sx - tx*sz, nz = tx*sy - ty*sx;
        let l = Math.hypot(nx,ny,nz);
        const vi = M.vOff + i*(radial+1) + j;
        if (l < 1e-12){
          const src = Math.min(i, st.pts.length-1);
          nx = P[vi*3]-st.pts[src].x; ny = P[vi*3+1]-st.pts[src].y; nz = P[vi*3+2]-st.pts[src].z;
          l = Math.hypot(nx,ny,nz) || 1;
        }
        nx/=l; ny/=l; nz/=l;
        // orient outward
        const src = Math.min(i, st.pts.length-1);
        const ox = P[vi*3]-st.pts[src].x, oy = P[vi*3+1]-st.pts[src].y, oz = P[vi*3+2]-st.pts[src].z;
        if (nx*ox+ny*oy+nz*oz < 0){ nx=-nx; ny=-ny; nz=-nz; }
        N[vi*3+0]=nx; N[vi*3+1]=ny; N[vi*3+2]=nz;
      }
    }

    /* Indices. The ring frame (N, B, T) is RIGHT handed — N x B = T — so
       walking j (around) then i (along) and emitting (a, c, b) puts the
       winding normal on the INSIDE. Under FrontSide culling that removes the
       outer surface and draws the far inner wall instead: the trunk appears
       to counter-rotate as the camera orbits, buried branch stubs draw in
       front of it, and the shadow map samples two radii too deep. The
       silhouette of a tube is identical either way, which is why this can sit
       there for a long time looking merely odd. */
    let k = M.iOff;
    for (let i=0;i<rings-1;i++){
      for (let j=0;j<radial;j++){
        const a = M.vOff + i*(radial+1) + j;
        const b = a+1;
        const c = M.vOff + (i+1)*(radial+1) + j;
        const d = c+1;
        IDX[k++]=a; IDX[k++]=b; IDX[k++]=c;
        IDX[k++]=b; IDX[k++]=d; IDX[k++]=c;
      }
    }
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(P,3));
  g.setAttribute('normal',   new THREE.BufferAttribute(N,3));
  g.setAttribute('uv',       new THREE.BufferAttribute(UV,2));
  g.setAttribute('aWeight',  new THREE.BufferAttribute(W,1));
  g.setAttribute('aInfo',    new THREE.BufferAttribute(IN,4));
  g.setAttribute('aRadius',  new THREE.BufferAttribute(RD,1));
  g.setIndex(new THREE.BufferAttribute(IDX,1));
  g.computeBoundingSphere();
  g.computeBoundingBox();
  TREE.stats.woodVerts = vTotal;
  TREE.stats.woodTris  = iTotal/3;
  return g;
}

/* --------------------------------------------------------------------------
   BARK SHADER
   -------------------------------------------------------------------------- */
const WOOD_VERT = GL.COMMON + GL.U_SWAY + GL.SWAY + `
attribute float aWeight;
attribute vec4  aInfo;
attribute float aRadius;
varying vec3 vWorld;
varying vec3 vNrm;
varying vec2 vTube;
varying vec4 vInfo;
varying float vRadius;
varying float vDist;
void main(){
  vec3 wp = (modelMatrix * vec4(position, 1.0)).xyz;
  wp += breathField(wp, aWeight);
  vWorld = wp;
  vNrm   = normalize(mat3(modelMatrix) * normal);
  vTube  = uv;
  vInfo  = aInfo;
  vRadius = aRadius;
  vec4 mv = viewMatrix * vec4(wp, 1.0);
  vDist  = -mv.z;
  gl_Position = projectionMatrix * mv;
}
`;

const WOOD_FRAG = GL.LIT_PARS + `
uniform sampler2D uBarkCol;
uniform sampler2D uBarkDat;
uniform vec3 uYoungBark;
uniform vec3 uMossCol;
uniform float uPomDepth;
varying vec3 vWorld;
varying vec3 vNrm;
varying vec2 vTube;
varying vec4 vInfo;
varying float vRadius;
varying float vDist;

/* cotangent frame — no baked tangents, correct for any tube orientation */
mat3 cotangent(vec3 N, vec3 p, vec2 uvc){
  vec3 dp1 = dFdx(p), dp2 = dFdy(p);
  vec2 du1 = dFdx(uvc), du2 = dFdy(uvc);
  vec3 dp2perp = cross(dp2, N);
  vec3 dp1perp = cross(N, dp1);
  vec3 T = dp2perp*du1.x + dp1perp*du2.x;
  vec3 B = dp2perp*du1.y + dp1perp*du2.y;
  float inv = inversesqrt(max(dot(T,T), dot(B,B)) + 1e-12);
  return mat3(T*inv, B*inv, N);
}

void main(){
  vec3 N = normalize(vNrm);
  vec3 V = normalize(cameraPosition - vWorld);
  vec2 uvT = vTube;
  float orderN = vInfo.x;
  float twig = smoothstep(0.20, 0.62, orderN);

  mat3 TBN = cotangent(N, vWorld, uvT);

#ifdef USE_POM
  if (twig < 0.35 && uPomDepth > 0.0){
    vec3 Vt = normalize(vec3(dot(V,TBN[0]), dot(V,TBN[1]), dot(V,TBN[2])));
    float steps = mix(20.0, 7.0, clamp(abs(Vt.z), 0.0, 1.0));
    float layer = 1.0/steps;
    /* The parallax offset is a DEPTH, in metres, and it has to be converted
       into this branch's own UV. One u unit is a circumference; one v unit is
       twice that. Authoring the offset directly in UV makes it ten times too
       large on the trunk, and the bark then slides across the wood as the
       camera moves — which reads as the trunk turning with you. */
    float rE = max(vRadius, 0.0042);
    vec2 mPerUV = vec2(6.2831853*max(vRadius, 1e-4), 12.5663706*rE);
    vec2 pomUV = (uPomDepth*(1.0-twig)) / mPerUV;
    vec2 delta = (Vt.xy / max(abs(Vt.z), 0.45)) * pomUV * layer;
    float cur = 0.0;
    vec2 uvc = uvT;
    float h = 1.0 - texture2D(uBarkDat, uvc).r;
    for (int i = 0; i < 20; i++){
      if (cur >= h) break;
      uvc -= delta; cur += layer;
      h = 1.0 - texture2D(uBarkDat, uvc).r;
    }
    vec2 prev = uvc + delta;
    float aft = h - cur;
    float bef = (1.0 - texture2D(uBarkDat, prev).r) - (cur - layer);
    uvT = mix(uvc, prev, clamp(aft/(aft - bef - 1e-5), 0.0, 1.0));
  }
#endif

  vec4 dat = texture2D(uBarkDat, uvT);
  vec3 alb = srgb2lin_(texture2D(uBarkCol, uvT).rgb);

  // height-derivative bump on top of the real vertex displacement
  vec2 tsz = vec2(1.0/320.0, 1.0/640.0);
  float hL = texture2D(uBarkDat, uvT - vec2(tsz.x,0.0)).r;
  float hR = texture2D(uBarkDat, uvT + vec2(tsz.x,0.0)).r;
  float hD = texture2D(uBarkDat, uvT - vec2(0.0,tsz.y)).r;
  float hU = texture2D(uBarkDat, uvT + vec2(0.0,tsz.y)).r;
  float bumpAmt = mix(2.4, 0.55, twig);
  vec3 nT = normalize(vec3((hL-hR)*bumpAmt, (hD-hU)*bumpAmt, 1.0));
  N = normalize(TBN * nT);

  // young wood is red-brown, smooth and shiny with strong lenticels;
  // old wood is grey, fissured and matte. lerp on branch order.
  float lent = smoothstep(0.55, 0.85, 1.0 - dat.r) * (1.0 - dat.b);
  vec3 young = uYoungBark * (0.72 + 0.55*dat.g);
  young = mix(young, young*0.42, lent*0.9);
  alb = mix(alb, young, twig);

  float rough = mix(dat.g*0.92 + 0.14, 0.44 + dat.g*0.20, twig);
  float cav   = mix(dat.b, 0.86 + 0.14*dat.b, twig);

  // wire spiral: a bruise on two older branches, correct and almost invisible
  if (vInfo.w > 0.5){
    float hx = fract(vTube.y*3.1 - vTube.x);
    float groove = smoothstep(0.40, 0.50, abs(hx-0.5));
    alb *= 1.0 - groove*0.28;
    cav *= 1.0 - groove*0.30;
    rough = mix(rough, rough*0.86, groove);
  }
  // healed pruning scar: callus roll bright, centre smooth and pale
  float scar = vInfo.z;
  if (scar > 0.001){
    float core = smoothstep(0.55, 0.95, scar);
    float roll = smoothstep(0.10, 0.52, scar) * (1.0 - core);
    alb  = mix(alb, vec3(0.108, 0.086, 0.068), core*0.85);
    alb  = mix(alb, alb*1.22, roll*0.6);
    rough = mix(rough, 0.52, core*0.8);
    cav   = mix(cav, 1.0, roll*0.4);
  }

  // moss lives in the crotches and the fissures, never on the exposed ridges
  float crotch = vInfo.y;
  float moss = smoothstep(0.62, 0.05, crotch) * dat.a * (1.0 - twig*0.75);
  moss *= smoothstep(0.10, 0.55, 1.0 - dat.r);
  alb = mix(alb, uMossCol * (0.60 + 0.75*dat.a), clamp(moss*1.25, 0.0, 0.92));
  rough = mix(rough, 0.94, moss);

  float ao = crotch * mix(0.80, 1.0, dat.b);

  vec3 col = shadeSurface(vWorld, N, V, alb, rough, 0.0, ao, cav,
                          0.0, vec3(1.0), 1.0, 1.0);
  gl_FragColor = vec4(col, vDist);
}
`;

const DEPTH_VERT_WOOD = GL.COMMON + GL.U_SWAY + GL.SWAY + `
attribute float aWeight;
attribute vec4  aInfo;
void main(){
  vec3 wp = (modelMatrix * vec4(position, 1.0)).xyz;
  wp += breathField(wp, aWeight);
  gl_Position = projectionMatrix * viewMatrix * vec4(wp, 1.0);
}
`;
const DEPTH_FRAG = GL.COMMON + `
vec4 packD_(float v){
  v = clamp(v, 0.0, 0.9999999);
  vec4 enc = fract(vec4(1.0, 255.0, 65025.0, 16581375.0) * v);
  enc -= enc.yzww * vec4(1.0/255.0, 1.0/255.0, 1.0/255.0, 0.0);
  return enc;
}
void main(){ gl_FragColor = packD_(gl_FragCoord.z); }
`;

function makeWoodMaterial(){
  const m = new THREE.ShaderMaterial({
    uniforms: litUniforms({
      uBarkCol:  { value: TEX.barkColor },
      uBarkDat:  { value: TEX.barkData },
      uYoungBark:{ value: new THREE.Vector3(0.132, 0.068, 0.046) },
      uMossCol:  { value: new THREE.Vector3(0.052, 0.098, 0.034) },
      uPomDepth: { value: CFG.pom ? 0.0013 : 0.0 }   // metres of bark relief
    }),
    defines: litDefines(CFG.pom ? { USE_POM: '1' } : {}),
    vertexShader: WOOD_VERT,
    fragmentShader: WOOD_FRAG,
    side: THREE.FrontSide,
    blending: THREE.NoBlending,
    transparent: false
  });
  return m;
}
function makeWoodDepthMaterial(){
  return new THREE.ShaderMaterial({
    uniforms: { uTime: LU.uTime, uBreath: LU.uBreath },
    vertexShader: DEPTH_VERT_WOOD,
    fragmentShader: DEPTH_FRAG,
    side: THREE.FrontSide,
    blending: THREE.NoBlending
  });
}

/* ============================================================================
   SECTION 07 — BLOSSOMS
   A real flower, not a billboard: five notched petals on individual hinges, a
   stamen boss, five reflexed sepals, the urn-shaped hypanthium cherries have,
   and a pedicel. Bud / open / spent are one vertex-shader morph about the
   petal hinges, so a bud is genuinely a folded flower and not a second mesh.
   ========================================================================= */

const PETAL_LEN = 0.0086;      // metres. flower reads ~20mm across, which is
                               // what prunus incisa actually is.
const PED_LEN   = 0.0102;
const HYP_LEN   = 0.0040;
const HINGE_R   = 0.00155;
const HYP_TOP   = PED_LEN + HYP_LEN;

/* petal outline, 3 vertices per row, 4 rows. the middle vertex of the top row
   sits low: that is the apical notch every prunus petal has. */
/* At hw 0.70 a petal was 1.4x as wide as it was long, so five of them
   overlapped by two thirds and the flower read as a disc rather than as five
   petals. Roughly square is what a prunus petal actually is. */
const PETAL_ROWS = [
  { y:0.000, hw:0.115, cy:0.000 },
  { y:0.390, hw:0.400, cy:0.390 },
  { y:0.775, hw:0.525, cy:0.775 },
  { y:0.985, hw:0.470, cy:0.878 }
];
/* five columns. three gives a pentagon, and a pentagon reads as origami. */
const PETAL_COLS = [-1.0, -0.60, 0.0, 0.60, 1.0];
function petalCup(x, y){ return -(0.130*y*y + 0.300*x*x*y); }

function buildFlowerGeometry(){
  const pos=[], nrm=[], uv=[], idx=[];
  let base = 0;
  const push = (x,y,z, nx,ny,nz, u,v) => {
    pos.push(x,y,z); nrm.push(nx,ny,nz); uv.push(u,v);
    return (pos.length/3)-1;
  };

  /* ---- a pine needle spray. ~15 thin tapered blades fan upward and
     outward from the shoot tip, tips arcing slightly down. One instance
     is one mini-spray; a pad reads as dozens of them. ---------------------- */
  {
    const R = makeRand(31415);
    const NN = 26;
    for (let k=0;k<NN;k++){
      const az0 = (k/NN)*TAU + R.range(-0.35, 0.35);
      const el  = R.range(0.25, 0.95);          // lean outward but stay up — pads, not sea urchins
      const L   = R.range(0.62, 1.0)*0.0115;
      const W   = 0.00052*(1.0+0.35*R());
      const dx = Math.sin(el)*Math.cos(az0), dy = Math.cos(el), dz = Math.sin(el)*Math.sin(az0);
      const sx = -Math.sin(az0), sz = Math.cos(az0);       // blade side vector
      const droop = R.range(0.04, 0.28)*L;
      const bx = dx*0.0011, by = 0.0003, bz = dz*0.0011;
      const tx = bx + dx*L, ty = by + dy*L - droop, tz = bz + dz*L;
      const tipW = W*0.10;
      let nX = dz, nY = 0.55, nZ = -dx;                    // blade normal, biased skyward
      const nl = Math.hypot(nX, nY, nZ); nX/=nl; nY/=nl; nZ/=nl;
      base = pos.length/3;
      push(bx - sx*W,    by, bz - sz*W,    nX,nY,nZ, 0,0);
      push(bx + sx*W,    by, bz + sz*W,    nX,nY,nZ, 1,0);
      push(tx - sx*tipW, ty, tz - sz*tipW, nX,nY,nZ, 0,1);
      push(tx + sx*tipW, ty, tz + sz*tipW, nX,nY,nZ, 1,1);
      idx.push(base,base+1,base+2, base+1,base+3,base+2);
    }
  }

  const g = new THREE.InstancedBufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pos),3));
  g.setAttribute('normal',   new THREE.BufferAttribute(new Float32Array(nrm),3));
  g.setAttribute('uv',       new THREE.BufferAttribute(new Float32Array(uv),2));
  g.setIndex(new THREE.BufferAttribute(new Uint16Array(idx),1));
  g.boundingSphere = new THREE.Sphere(new THREE.Vector3(0, 0.006, 0), 0.016);
  g.userData.tris = idx.length/3;
  g.userData.verts = pos.length/3;
  return g;
}

/* --------------------------------------------------------------------------
   VERTEX PROGRAM — shared verbatim by the lit pass and the shadow pass.
   The only structural input is aFW (compliance weight); the only positional
   input to the sway field is a world position. Nothing else.
   -------------------------------------------------------------------------- */
const FLOWER_VERT_CORE = `
attribute vec4  aFlower;   // tone(new↔old needles), droop, unused, seed
attribute float aFW;       // sway weight

void flowerVertex(out vec3 wp, out vec3 wn, out float rt, out float part, out vec4 fl){
  fl   = aFlower;
  part = 0.0;
  rt   = uv.y;

  vec3 lp = position;
  vec3 ln = normal;

  // per-spray character: size jitter, a slight outward spread, and droop
  float s = 0.85 + 0.30*fl.w;
  lp.xz *= 1.0 + fl.y*0.35;
  lp *= s;
  lp.y -= fl.y*0.20*length(lp.xz);

  // per-instance uniform scale + orientation live in instanceMatrix
  vec4 ip = instanceMatrix * vec4(lp, 1.0);
  vec4 wp4 = modelMatrix * ip;
  vec3 anchor = (modelMatrix * (instanceMatrix * vec4(0.0, 0.0, 0.0, 1.0))).xyz;

  mat3 im = mat3(instanceMatrix);
  wn = normalize(mat3(modelMatrix) * normalize(im * ln));

  wp = wp4.xyz;
  // rigid: the whole spray rides its twig tip exactly
  wp += breathField(anchor, aFW);
  // needle tips alone quiver a little
  float flut = breathPulse(wp) * aFW * uv.y;
  wp += wn * flut * 0.0007;
}
`;

const FLOWER_VERT = GL.COMMON + GL.U_SWAY + GL.SWAY + FLOWER_VERT_CORE + `
varying vec3 vWorld;
varying vec3 vNrm;
varying vec2 vUv;
varying float vRT;
varying float vPart;
varying vec4 vFlower;
varying float vDist;
void main(){
  vec3 wp, wn; float rt, part; vec4 fl;
  flowerVertex(wp, wn, rt, part, fl);
  vWorld = wp; vNrm = wn; vUv = uv; vRT = rt; vPart = part; vFlower = fl;
  vec4 mv = viewMatrix * vec4(wp, 1.0);
  vDist = -mv.z;
  gl_Position = projectionMatrix * mv;
}
`;

const FLOWER_FRAG = GL.LIT_PARS + `
uniform vec3 uNeedleBase;
uniform vec3 uNeedleTip;
uniform vec3 uNeedleYoung;
varying vec3 vWorld;
varying vec3 vNrm;
varying vec2 vUv;
varying float vRT;
varying float vPart;
varying vec4 vFlower;
varying float vDist;

void main(){
  vec3 N = normalize(vNrm);
  if (!gl_FrontFacing) N = -N;
  vec3 V = normalize(cameraPosition - vWorld);

  // dark olive at the fascicle, yellow-green toward the needle tip, and the
  // current year's growth a touch brighter than last year's
  float t = clamp(vRT, 0.0, 1.0);
  vec3 alb = mix(uNeedleBase, uNeedleTip, smoothstep(0.15, 1.0, t));
  alb = mix(alb, uNeedleYoung, smoothstep(0.68, 1.0, vFlower.x)*0.50);
  // the spray is densest at its heart — fake a little self-shadow
  alb *= 0.72 + 0.38*t;
  float rough = 0.86 - 0.10*t;

  vec3 col = shadeSurface(vWorld, N, V, alb, rough, 0.0, 0.92, 1.0, 0.0, vec3(1.0), 0.7, 1.0);
  gl_FragColor = vec4(col, vDist);
}
`;

const FLOWER_DEPTH_VERT = GL.COMMON + GL.U_SWAY + GL.SWAY + FLOWER_VERT_CORE + `
varying vec2 vUv;
varying float vPart;
void main(){
  vec3 wp, wn; float rt, part; vec4 fl;
  flowerVertex(wp, wn, rt, part, fl);
  vUv = uv; vPart = part;
  gl_Position = projectionMatrix * viewMatrix * vec4(wp, 1.0);
}
`;
const FLOWER_DEPTH_FRAG = GL.COMMON + `
varying vec2 vUv;
varying float vPart;
vec4 packD_(float v){
  v = clamp(v, 0.0, 0.9999999);
  vec4 enc = fract(vec4(1.0, 255.0, 65025.0, 16581375.0) * v);
  enc -= enc.yzww * vec4(1.0/255.0, 1.0/255.0, 1.0/255.0, 0.0);
  return enc;
}
void main(){
  gl_FragColor = packD_(gl_FragCoord.z);
}
`;

/* --------------------------------------------------------------------------
   INSTANCING
   -------------------------------------------------------------------------- */
function buildBlossoms(){
  const g = buildFlowerGeometry();
  const sites = TREE.flowers;
  const R = makeRand(515151);
  // shuffle so subsampling stays spatially even
  const order = new Int32Array(sites.length);
  for (let i=0;i<sites.length;i++) order[i]=i;
  for (let i=sites.length-1;i>0;i--){ const j=(R()* (i+1))|0; const t=order[i]; order[i]=order[j]; order[j]=t; }
  const count = Math.min(CFG.blossoms, sites.length);

  const flowerAttr = new Float32Array(count*4);
  const wAttr = new Float32Array(count);
  const mesh = new THREE.InstancedMesh(g, null, count);
  mesh.frustumCulled = false;

  const q = new THREE.Quaternion(), q2 = new THREE.Quaternion();
  const up = new THREE.Vector3(0,1,0);
  const m = new THREE.Matrix4();
  const sc = new THREE.Vector3();
  let nBud=0, nSpent=0;
  for (let i=0;i<count;i++){
    const s = sites[order[i]];
    // the spray's +Y axis points along the shoot's outward/upward direction
    // stored with the site, so needles never hang their faces at the soil
    q.setFromUnitVectors(up, s.dir);
    q2.setFromAxisAngle(s.dir, R.range(0,TAU));
    q.premultiply(q2);
    const scale = R.range(0.78, 1.46);
    sc.set(scale, scale, scale);
    m.compose(s.pos, q, sc);
    mesh.setMatrixAt(i, m);

    flowerAttr[i*4+0] = R();                              // this year / last year tone
    flowerAttr[i*4+1] = Math.pow(R(), 1.6)*0.85;          // droop bias: mostly perky
    flowerAttr[i*4+2] = 0.0;
    flowerAttr[i*4+3] = R();
    wAttr[i] = s.w;
  }
  mesh.instanceMatrix.needsUpdate = true;
  g.setAttribute('aFlower', new THREE.InstancedBufferAttribute(flowerAttr,4));
  g.setAttribute('aFW',     new THREE.InstancedBufferAttribute(wAttr,1));

  const uni = litUniforms({
    uNeedleBase: { value: new THREE.Vector3(0.013, 0.042, 0.009) },
    uNeedleTip:  { value: new THREE.Vector3(0.052, 0.112, 0.028) },
    uNeedleYoung:{ value: new THREE.Vector3(0.105, 0.170, 0.048) }
  });
  mesh.material = new THREE.ShaderMaterial({
    uniforms: uni,
    defines: litDefines(),
    vertexShader: FLOWER_VERT,
    fragmentShader: FLOWER_FRAG,
    side: THREE.DoubleSide,
    blending: THREE.NoBlending,
    transparent: false
  });
  mesh.userData.depthMaterial = new THREE.ShaderMaterial({
    uniforms: {
      uTime: LU.uTime, uBreath: LU.uBreath
    },
    vertexShader: FLOWER_DEPTH_VERT,
    fragmentShader: FLOWER_DEPTH_FRAG,
    side: THREE.DoubleSide,
    blending: THREE.NoBlending
  });
  TREE.stats.blossoms = count;
  TREE.stats.buds = nBud;
  TREE.stats.spent = nSpent;
  TREE.stats.blossomTris = count * g.userData.tris;
  return mesh;
}

/* --------------------------------------------------------------------------
   NEW LEAVES — a handful of bronze ones. Blooms before leaf-out.
   -------------------------------------------------------------------------- */
function buildLeaves(){
  const W = 0.0068, H = 0.0150;
  const pos=[],nrm=[],uv=[],idx=[];
  const COLS=3, ROWS=4;
  for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++){
    const u=c/(COLS-1), v=r/(ROWS-1);
    const x=(u-0.5)*2.0*W;
    const y=v*H;
    // leaves fold along the midrib and curve back
    const z = -Math.abs(x)*0.30 - v*v*H*0.24;
    pos.push(x,y,z);
    const nx=Math.sign(x)*0.30, ny=v*0.30, nz=1.0;
    const l=Math.hypot(nx,ny,nz);
    nrm.push(nx/l,ny/l,nz/l);
    uv.push(u,v);
  }
  for (let r=0;r<ROWS-1;r++) for (let c=0;c<COLS-1;c++){
    const a=r*COLS+c, b=a+1, d=a+COLS, e=d+1;
    idx.push(a,d,b, b,d,e);
  }
  const g = new THREE.InstancedBufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pos),3));
  g.setAttribute('normal',   new THREE.BufferAttribute(new Float32Array(nrm),3));
  g.setAttribute('uv',       new THREE.BufferAttribute(new Float32Array(uv),2));
  g.setIndex(new THREE.BufferAttribute(new Uint16Array(idx),1));
  g.boundingSphere = new THREE.Sphere(new THREE.Vector3(0,H*0.5,0), H);

  const sites = TREE.leaves;
  const count = Math.min(CFG.newLeaves, sites.length);
  const R = makeRand(818181);
  const wAttr = new Float32Array(Math.max(count,1));
  const mesh = new THREE.InstancedMesh(g, null, Math.max(count,1));
  mesh.frustumCulled = false;
  const q=new THREE.Quaternion(), q2=new THREE.Quaternion(), m=new THREE.Matrix4();
  const up=new THREE.Vector3(0,1,0), sc=new THREE.Vector3();
  for (let i=0;i<count;i++){
    const s=sites[i];
    const d = s.dir.clone(); d.y = d.y*0.5 + 0.35; d.normalize();
    q.setFromUnitVectors(up, d);
    q2.setFromAxisAngle(d, R.range(0,TAU));
    q.premultiply(q2);
    const sk=R.range(0.72,1.20); sc.set(sk,sk,sk);
    m.compose(s.pos, q, sc);
    mesh.setMatrixAt(i, m);
    wAttr[i]=s.w;
  }
  if (count === 0){ m.makeScale(0,0,0); mesh.setMatrixAt(0,m); wAttr[0]=0; }
  mesh.instanceMatrix.needsUpdate = true;
  g.setAttribute('aFW', new THREE.InstancedBufferAttribute(wAttr,1));

  const vert = GL.COMMON + GL.U_SWAY + GL.SWAY + `
attribute float aFW;
varying vec3 vWorld; varying vec3 vNrm; varying vec2 vUv; varying float vDist;
void main(){
  vec4 ip = instanceMatrix * vec4(position, 1.0);
  vec3 wp = (modelMatrix * ip).xyz;
  vec3 anchor = (modelMatrix * (instanceMatrix * vec4(0.0,0.0,0.0,1.0))).xyz;
  wp += breathField(anchor, aFW);
  vec3 wn = normalize(mat3(modelMatrix) * (mat3(instanceMatrix) * normal));
  wp += wn * (breathPulse(wp) * aFW * uv.y * 0.0016);
  vWorld = wp; vNrm = wn; vUv = uv;
  vec4 mv = viewMatrix * vec4(wp,1.0);
  vDist = -mv.z;
  gl_Position = projectionMatrix * mv;
}`;
  const frag = GL.LIT_PARS + `
uniform sampler2D uLeafTex;
varying vec3 vWorld; varying vec3 vNrm; varying vec2 vUv; varying float vDist;
void main(){
  vec4 t = texture2D(uLeafTex, vUv);
  if (t.a < 0.5) discard;
  vec3 N = normalize(vNrm);
  if (!gl_FrontFacing) N = -N;
  vec3 V = normalize(cameraPosition - vWorld);
  vec3 alb = srgb2lin_(t.rgb);
  vec3 col = shadeSurface(vWorld, N, V, alb, 0.42, 0.0, 1.0, 1.0, 0.85,
                          vec3(1.0,0.52,0.30), 1.25, 1.0);
  gl_FragColor = vec4(col, vDist);
}`;
  mesh.material = new THREE.ShaderMaterial({
    uniforms: litUniforms({ uLeafTex: { value: TEX.leaf } }),
    defines: litDefines(),
    vertexShader: vert, fragmentShader: frag,
    side: THREE.DoubleSide, blending: THREE.NoBlending, transparent: false
  });
  mesh.userData.depthMaterial = new THREE.ShaderMaterial({
    uniforms: { uTime: LU.uTime, uBreath: LU.uBreath, uLeafTex: { value: TEX.leaf } },
    vertexShader: GL.COMMON + GL.U_SWAY + GL.SWAY + `
attribute float aFW;
varying vec2 vUv;
void main(){
  vec4 ip = instanceMatrix * vec4(position,1.0);
  vec3 wp = (modelMatrix * ip).xyz;
  vec3 anchor = (modelMatrix * (instanceMatrix * vec4(0.0,0.0,0.0,1.0))).xyz;
  wp += breathField(anchor, aFW);
  vUv = uv;
  gl_Position = projectionMatrix * viewMatrix * vec4(wp,1.0);
}`,
    fragmentShader: GL.COMMON + `
uniform sampler2D uLeafTex;
varying vec2 vUv;
vec4 packD_(float v){
  v = clamp(v, 0.0, 0.9999999);
  vec4 enc = fract(vec4(1.0, 255.0, 65025.0, 16581375.0) * v);
  enc -= enc.yzww * vec4(1.0/255.0,1.0/255.0,1.0/255.0,0.0);
  return enc;
}
void main(){
  if (texture2D(uLeafTex, vUv).a < 0.5) discard;
  gl_FragColor = packD_(gl_FragCoord.z);
}`,
    side: THREE.DoubleSide, blending: THREE.NoBlending
  });
  TREE.stats.leaves = count;
  return mesh;
}

/* ============================================================================
   SECTION 08 — POT, SOIL, MOSS, TIE-DOWN WIRE
   Glazed stoneware, soft rectangle, celadon. A real lip profile with an
   undercut, a foot ring, four feet, drainage holes with mesh, and the copper
   wire that actually anchors the tree. Soil is instanced akadama and pumice.
   ========================================================================= */

const POT = { A:0.1700, B:0.1700, H:0.0920, FOOT:0.0120, SOIL_Y:0.0830 };
/* the tree is not planted in the middle of the pot. it never is. */
const TREE_OFF_X = -0.0295, TREE_OFF_Z = 0.0155;

/* one shader for every static surface in the piece. the mode is a compile
   time define, so there is exactly one code path to validate. */
const STD_VERT = GL.COMMON + `
attribute vec4 aExtra;
varying vec3 vWorld;
varying vec3 vNrm;
varying vec2 vUv;
varying vec4 vExtra;
varying float vDist;
void main(){
  vec3 lp = position;
  vec3 ln = normal;
#ifdef INSTANCED
  vec4 ip = instanceMatrix * vec4(lp, 1.0);
  lp = ip.xyz;
  ln = normalize(mat3(instanceMatrix) * ln);
#endif
  vec3 wp = (modelMatrix * vec4(lp, 1.0)).xyz;
  vWorld = wp;
  vNrm = normalize(mat3(modelMatrix) * ln);
  vUv = uv;
  vExtra = aExtra;
  vec4 mv = viewMatrix * vec4(wp, 1.0);
  vDist = -mv.z;
  gl_Position = projectionMatrix * mv;
}
`;

const STD_FRAG = GL.LIT_PARS + `
uniform sampler2D uMap;
uniform sampler2D uMap2;
uniform vec3  uTint;
uniform vec3  uTint2;
uniform vec4  uParams;   // rough, metal, uvScaleX, uvScaleY
uniform vec4  uParams2;  // trans, aoStrength, extraA, extraB
uniform vec3  uEmissive;
varying vec3 vWorld;
varying vec3 vNrm;
varying vec2 vUv;
varying vec4 vExtra;
varying float vDist;

vec3 bumpFromMap(sampler2D t, vec2 uvc, vec2 tsz, float amt, vec3 N, vec3 P, int chan){
  vec3 dp1 = dFdx(P), dp2 = dFdy(P);
  vec2 du1 = dFdx(uvc), du2 = dFdy(uvc);
  vec3 dp2p = cross(dp2, N), dp1p = cross(N, dp1);
  vec3 T = dp2p*du1.x + dp1p*du2.x;
  vec3 B = dp2p*du1.y + dp1p*du2.y;
  float inv = inversesqrt(max(dot(T,T), dot(B,B)) + 1e-12);
  vec4 hl = texture2D(t, uvc - vec2(tsz.x,0.0));
  vec4 hr = texture2D(t, uvc + vec2(tsz.x,0.0));
  vec4 hd = texture2D(t, uvc - vec2(0.0,tsz.y));
  vec4 hu = texture2D(t, uvc + vec2(0.0,tsz.y));
  float l = (chan==0)?hl.r:((chan==1)?hl.g:((chan==2)?hl.b:hl.a));
  float r = (chan==0)?hr.r:((chan==1)?hr.g:((chan==2)?hr.b:hr.a));
  float d = (chan==0)?hd.r:((chan==1)?hd.g:((chan==2)?hd.b:hd.a));
  float u = (chan==0)?hu.r:((chan==1)?hu.g:((chan==2)?hu.b:hu.a));
  vec3 nt = normalize(vec3((l-r)*amt, (d-u)*amt, 1.0));
  return normalize(mat3(T*inv, B*inv, N) * nt);
}

void main(){
  vec3 N = normalize(vNrm);
#ifdef TWO_SIDED
  if (!gl_FrontFacing) N = -N;
#endif
  vec3 V = normalize(cameraPosition - vWorld);
  vec2 uvc = vUv * uParams.zw;
  vec3 alb = uTint;
  float rough = uParams.x, metal = uParams.y;
  float ao = mix(1.0, vExtra.x, uParams2.y);
  float cav = 1.0;
  float trans = uParams2.x;
  vec3  tint = vec3(1.0, 0.55, 0.42);
  float spec = 1.0;
  float emissMod = 1.0;

#if defined(MODE_GLAZE)
  vec4 gz = texture2D(uMap, uvc);
  float pool = vExtra.y;
  // celadon: the glaze runs thin on the ridges and pools blue-green in every
  // recess. iron speckle bleeds through where it is thinnest.
  vec3 thin = uTint;
  vec3 deep = uTint2;
  alb = mix(thin, deep, clamp(pool*0.85 + gz.g*0.35, 0.0, 1.0));
  alb = mix(alb, vec3(0.085,0.062,0.046), gz.b*0.75*(1.0-pool*0.6));
  // crazing: hairline brown-stained cracks, and they catch a little light
  float cz = smoothstep(0.42, 0.98, gz.r);
  alb = mix(alb, alb*vec3(0.44,0.40,0.36), cz*0.80);
  rough = mix(uParams.x, 0.42, cz*0.7) * (0.86 + 0.30*gz.a);
  rough = mix(rough, rough*1.9, vExtra.w);          // unglazed foot
  alb = mix(alb, vec3(0.118,0.086,0.070), vExtra.w);
  N = bumpFromMap(uMap, uvc, vec2(1.0/384.0), 0.55 + cz*2.2, N, vWorld, 0);
  cav = mix(1.0, 0.72, pool);
  spec = 1.35;
#elif defined(MODE_WOOD)
  vec4 wd = texture2D(uMap, uvc);
  alb = srgb2lin_(wd.rgb) * uTint;
  rough = uParams.x * (0.72 + 0.55*(1.0-wd.a));
  N = bumpFromMap(uMap, uvc, vec2(1.0/384.0), uParams2.z, N, vWorld, 3);
  cav = mix(1.0, wd.a, 0.55);
  spec = 1.2;
#elif defined(MODE_CLAY)
  vec4 cl = texture2D(uMap, uvc);
  alb = srgb2lin_(cl.rgb) * uTint;
  cav = mix(1.0, cl.a, 0.8);
  N = bumpFromMap(uMap, uvc, vec2(1.0/384.0), 1.6, N, vWorld, 3);
#elif defined(MODE_TATAMI)
  vec4 tm = texture2D(uMap, uvc);
  alb = srgb2lin_(tm.rgb) * uTint;
  N = bumpFromMap(uMap, uvc, vec2(1.0/256.0), 2.4, N, vWorld, 3);
  cav = mix(1.0, tm.a, 0.45);
  // rush has a strong sheen along the fibre
  rough = uParams.x * (0.80 + 0.35*tm.a);
  trans = 0.18; tint = vec3(1.0,0.80,0.42);
#elif defined(MODE_SOIL)
  vec4 sl = texture2D(uMap, uvc);
  alb = srgb2lin_(sl.rgb) * uTint;
  float moss = vExtra.z;
  alb = mix(alb, uTint2 * (0.72 + 0.55*texture2D(uMap, uvc*3.7).a), moss);
  rough = mix(uParams.x, 0.95, moss);
  cav = mix(1.0, sl.a, 0.7);
  N = bumpFromMap(uMap, uvc, vec2(1.0/192.0), 1.4, N, vWorld, 3);
#elif defined(MODE_SCROLL)
  vec4 sc = texture2D(uMap, uvc);
  alb = srgb2lin_(sc.rgb) * uTint;
  trans = 0.55; tint = vec3(1.0,0.86,0.66);
  rough = uParams.x;
#elif defined(MODE_PAPER)
  vec4 pp = texture2D(uMap, uvc);
  float fib = 0.72 + 0.55*pp.r;
  alb = uTint * fib;
  rough = uParams.x;
  trans = 0.9; tint = vec3(1.0,0.94,0.86);
  // paper is not a lightbox: the fibre and the slubs modulate what comes through
  emissMod = fib * (0.88 + 0.24*pp.g) * (1.0 + pp.b*0.9);
#elif defined(MODE_GRANULE)
  alb = vExtra.xyz;
  rough = uParams.x * (0.80 + 0.40*vExtra.w);
  cav = 0.80 + 0.20*vExtra.w;
  ao = 1.0;
#elif defined(MODE_MOSS)
  vec4 ms = texture2D(uMap, uvc);
  if (ms.a < 0.42) discard;
  alb = srgb2lin_(ms.rgb) * mix(uTint, uTint2, vExtra.z);
  rough = 0.92; trans = 0.65; tint = vec3(0.68,1.0,0.44); spec = 0.7;
#endif

  vec3 col = shadeSurface(vWorld, N, V, alb, rough, metal, ao, cav, trans, tint, spec, 1.0);
#ifdef EMISSIVE
  col += uEmissive * emissMod;
#endif
  gl_FragColor = vec4(col, vDist);
}
`;

const STATIC_DEPTH_VERT = `
void main(){
  vec3 lp = position;
#ifdef INSTANCED
  lp = (instanceMatrix * vec4(lp, 1.0)).xyz;
#endif
  gl_Position = projectionMatrix * viewMatrix * modelMatrix * vec4(lp, 1.0);
}
`;
const STATIC_DEPTH_VERT_UV = `
varying vec2 vUv;
void main(){
  vec3 lp = position;
#ifdef INSTANCED
  lp = (instanceMatrix * vec4(lp, 1.0)).xyz;
#endif
  vUv = uv;
  gl_Position = projectionMatrix * viewMatrix * modelMatrix * vec4(lp, 1.0);
}
`;
const STATIC_DEPTH_FRAG_CUT = GL.COMMON + `
uniform sampler2D uMap;
uniform vec4 uParams;
varying vec2 vUv;
vec4 packD_(float v){
  v = clamp(v, 0.0, 0.9999999);
  vec4 enc = fract(vec4(1.0, 255.0, 65025.0, 16581375.0) * v);
  enc -= enc.yzww * vec4(1.0/255.0,1.0/255.0,1.0/255.0,0.0);
  return enc;
}
void main(){
  if (texture2D(uMap, vUv*uParams.zw).a < 0.42) discard;
  gl_FragColor = packD_(gl_FragCoord.z);
}
`;

let _staticDepth = null, _staticDepthInst = null;
function staticDepthMaterial(instanced){
  if (instanced){
    if (!_staticDepthInst) _staticDepthInst = new THREE.ShaderMaterial({
      uniforms:{}, defines:{ INSTANCED:'1' },
      vertexShader: STATIC_DEPTH_VERT, fragmentShader: DEPTH_FRAG,
      blending: THREE.NoBlending });
    return _staticDepthInst;
  }
  if (!_staticDepth) _staticDepth = new THREE.ShaderMaterial({
    uniforms:{}, vertexShader: STATIC_DEPTH_VERT, fragmentShader: DEPTH_FRAG,
    blending: THREE.NoBlending });
  return _staticDepth;
}

function makeStdMaterial(mode, o){
  o = o || {};
  const defs = litDefines();
  defs['MODE_' + mode] = '1';
  if (o.instanced) defs.INSTANCED = '1';
  if (o.twoSided)  defs.TWO_SIDED = '1';
  if (o.emissive)  defs.EMISSIVE = '1';
  const m = new THREE.ShaderMaterial({
    uniforms: litUniforms({
      uMap:      { value: o.map || TEX.soil },
      uMap2:     { value: o.map2 || TEX.soil },
      uTint:     { value: o.tint  || new THREE.Vector3(0.5,0.5,0.5) },
      uTint2:    { value: o.tint2 || new THREE.Vector3(0.5,0.5,0.5) },
      uParams:   { value: new THREE.Vector4(
                     o.rough===undefined?0.7:o.rough, o.metal||0.0,
                     o.uvx===undefined?1:o.uvx, o.uvy===undefined?1:o.uvy) },
      uParams2:  { value: new THREE.Vector4(o.trans||0.0,
                     o.aoStrength===undefined?1.0:o.aoStrength,
                     o.bump===undefined?1.2:o.bump, o.extraB||0.0) },
      uEmissive: { value: o.emissiveColor || new THREE.Vector3(0,0,0) }
    }),
    defines: defs,
    vertexShader: STD_VERT,
    fragmentShader: STD_FRAG,
    side: o.twoSided ? THREE.DoubleSide : THREE.FrontSide,
    blending: THREE.NoBlending,
    transparent: false
  });
  return m;
}

/* ---- attribute helper ---------------------------------------------------- */
function setExtra(geom, fn){
  const p = geom.attributes.position;
  const n = geom.attributes.normal;
  const uv = geom.attributes.uv;
  const a = new Float32Array(p.count*4);
  const v = new THREE.Vector3(), nv = new THREE.Vector3();
  const out = [0,0,0,0];
  for (let i=0;i<p.count;i++){
    v.fromBufferAttribute(p,i);
    if (n) nv.fromBufferAttribute(n,i);
    out[0]=1; out[1]=0; out[2]=0; out[3]=0;
    if (fn) fn(v, nv, i, out, uv);
    a[i*4]=out[0]; a[i*4+1]=out[1]; a[i*4+2]=out[2]; a[i*4+3]=out[3];
  }
  geom.setAttribute('aExtra', new THREE.BufferAttribute(a,4));
  return geom;
}

/* --------------------------------------------------------------------------
   POT — superellipse cross-section swept along a closed lathe profile.
   -------------------------------------------------------------------------- */
function superEllipse(th, n, out){
  const c = Math.cos(th), s = Math.sin(th);
  const e = 2.0/n;
  out[0] = Math.sign(c)*Math.pow(Math.abs(c), e);
  out[1] = Math.sign(s)*Math.pow(Math.abs(s), e);
  return out;
}

/* profile: [ scale, y, pool, unglazed, sharp ] walked once around the section */
const POT_PROFILE = [
  [0.000, 0.0000, 0.95, 1.0, 1],   // underside centre
  [0.680, 0.0000, 0.80, 1.0, 0],
  [0.735, 0.0000, 0.65, 1.0, 1],   // foot ring outer edge
  [0.760, 0.0114, 0.55, 0.75, 1],
  [0.810, 0.0187, 0.30, 0.15, 0],
  [0.880, 0.0311, 0.14, 0.0,  0],
  [0.940, 0.0501, 0.05, 0.0,  0],
  [0.978, 0.0701, 0.06, 0.0,  0],
  [0.992, 0.0780, 0.34, 0.0,  1],  // undercut below the lip
  [1.000, 0.0837, 0.10, 0.0,  1],  // lip flare
  [1.000, 0.0917, 0.00, 0.0,  1],  // lip top outer
  [0.958, 0.0920, 0.22, 0.0,  1],  // lip top inner
  [0.944, 0.0812, 0.55, 0.0,  0],  // inner wall
  [0.918, 0.0476, 0.72, 0.0,  0],
  [0.892, 0.0263, 0.90, 0.0,  1],  // inner floor fillet
  [0.700, 0.0203, 0.95, 0.0,  0],
  [0.000, 0.0194, 0.98, 0.0,  0]   // inner floor centre
];

function buildPot(){
  const SEG = 84, N = POT_PROFILE.length;
  const pos=[],nrm=[],uv=[],ex=[],idx=[];
  const se=[0,0];
  const ring = (k) => {
    const P = POT_PROFILE[k];
    for (let j=0;j<=SEG;j++){
      const th = (j%SEG)/SEG*TAU;
      superEllipse(th, 2.0, se);
      const x = se[0]*POT.A*P[0];
      const z = se[1]*POT.B*P[0];
      pos.push(x, P[1], z);
      uv.push(j/SEG*3.0, k/(N-1)*2.2);
      ex.push(1.0, P[2], 0.0, P[3]);
      nrm.push(0,0,0);
    }
  };
  for (let k=0;k<N;k++) ring(k);
  for (let k=0;k<N-1;k++) for (let j=0;j<SEG;j++){
    const a=k*(SEG+1)+j, b=a+1, c=(k+1)*(SEG+1)+j, d=c+1;
    idx.push(a,b,c, b,d,c);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pos),3));
  g.setAttribute('uv',       new THREE.BufferAttribute(new Float32Array(uv),2));
  g.setAttribute('aExtra',   new THREE.BufferAttribute(new Float32Array(ex),4));
  g.setIndex(new THREE.BufferAttribute(new Uint32Array(idx),1));
  g.computeVertexNormals();
  // hard edges on the lip and the foot: re-face those rings flat
  const nrmA = g.attributes.normal.array;
  for (let k=0;k<N;k++){
    if (!POT_PROFILE[k][4]) continue;
    for (let j=0;j<=SEG;j++){
      const i=(k*(SEG+1)+j)*3;
      // bias the normal toward the local section plane so the edge reads crisp
      const kn = (k<8) ? 1.0 : -1.0;
      nrmA[i+1] = nrmA[i+1]*0.35 + kn*0.42;
    }
  }
  for (let i=0;i<nrmA.length;i+=3){
    const l=Math.hypot(nrmA[i],nrmA[i+1],nrmA[i+2])||1;
    nrmA[i]/=l; nrmA[i+1]/=l; nrmA[i+2]/=l;
  }
  g.attributes.normal.needsUpdate = true;
  g.computeBoundingSphere();

  const mat = makeStdMaterial('GLAZE', {
    map: TEX.glaze, rough: 0.28, twoSided: true,
    tint:  new THREE.Vector3(0.450, 0.185, 0.105),   // warm terracotta clay body
    tint2: new THREE.Vector3(0.210, 0.080, 0.040),   // pooled rim shadows
    uvx: 1.0, uvy: 1.0, aoStrength: 0.9
  });
  const mesh = new THREE.Mesh(g, mat);
  mesh.userData.depthMaterial = staticDepthMaterial(false);
  mesh.name = 'pot';
  return mesh;
}

function buildPotFeet(){
  /* a round bowl stands on a foot ring, not four corner blocks */
  const pos=[],nrm=[],uv=[],ex=[],idx=[];
  const SEG = 84, h = POT.FOOT;
  // profile pairs: [radiusFactor, y, extra.R]
  const prof = [
    [0.600, -h,   0.62],   // ring bottom outer
    [0.625, 0.0,  0.62],   // ring top outer (meets the bowl underside)
    [0.545, 0.0,  0.50],   // ring top inner
    [0.560, -h,   0.50]    // ring bottom inner
  ];
  const start = [];
  for (let k=0;k<prof.length;k++){
    start.push(pos.length/3);
    for (let j=0;j<=SEG;j++){
      const th=(j%SEG)/SEG*TAU;
      const r = POT.A*prof[k][0];
      pos.push(Math.cos(th)*r, prof[k][1], Math.sin(th)*r);
      uv.push(j/SEG*5.0, k*0.5);
      ex.push(prof[k][2], 0.55, 0.0, 1.0);
      nrm.push(0,0,0);
    }
  }
  for (let k=0;k<3;k++){
    const A=start[k], B=start[k+1];
    for (let j=0;j<SEG;j++){
      idx.push(A+j, A+j+1, B+j,  A+j+1, B+j+1, B+j);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pos),3));
  g.setAttribute('uv',       new THREE.BufferAttribute(new Float32Array(uv),2));
  g.setAttribute('aExtra',   new THREE.BufferAttribute(new Float32Array(ex),4));
  g.setIndex(new THREE.BufferAttribute(new Uint32Array(idx),1));
  g.computeVertexNormals();
  const mat = makeStdMaterial('GLAZE', {
    map: TEX.glaze, rough: 0.32, twoSided: true,
    tint:  new THREE.Vector3(0.430, 0.178, 0.100),
    tint2: new THREE.Vector3(0.200, 0.078, 0.040),
    aoStrength: 1.0
  });
  const m = new THREE.Mesh(g, mat);
  m.userData.depthMaterial = staticDepthMaterial(false);
  m.name='potFeet';
  return m;
}

/* drainage holes + mesh screen, on the underside where they are actually seen */
function buildDrainage(){
  const grp = new THREE.Group();
  const holes = [[-0.070, 0.002], [0.070, -0.004]];
  const rings = [], screens = [];
  for (let i=0;i<holes.length;i++){
    const r = setExtra(new THREE.RingGeometry(0.0125, 0.0190, 22, 1),
      (v,n,idx,o)=>{ o[0]=0.45; o[1]=0.9; o[3]=1.0; });
    r.rotateX(Math.PI*0.5);
    r.translate(holes[i][0], -0.0002, holes[i][1]);
    r.computeVertexNormals();
    rings.push(r);
    const s = setExtra(new THREE.CircleGeometry(0.0138, 20),
      (v,n,idx,o)=>{ o[0]=0.10; o[1]=0.075; o[2]=0.060; o[3]=0.35; });
    s.rotateX(Math.PI*0.5);
    s.translate(holes[i][0], 0.0030, holes[i][1]);
    s.computeVertexNormals();
    screens.push(s);
  }
  const ringMesh = new THREE.Mesh(mergeGeos(rings), makeStdMaterial('GLAZE', {
    map: TEX.glaze, rough: 0.55, twoSided: true,
    tint: new THREE.Vector3(0.072,0.062,0.052),
    tint2: new THREE.Vector3(0.030,0.032,0.028) }));
  ringMesh.name = 'drainRing';
  const screenMesh = new THREE.Mesh(mergeGeos(screens),
    makeStdMaterial('GRANULE', { rough: 0.62, twoSided: true }));
  screenMesh.name = 'drainMesh';
  grp.add(ringMesh); grp.add(screenMesh);
  grp.traverse(o=>{ if(o.isMesh) o.userData.depthMaterial = staticDepthMaterial(false); });
  return grp;
}

/* --------------------------------------------------------------------------
   SOIL BED + AKADAMA
   -------------------------------------------------------------------------- */
function soilHeight(x, z){
  const rr = Math.hypot(x/(POT.A*0.90), z/(POT.B*0.90));
  const dome = Math.cos(sat(rr)*Math.PI*0.5);
  return POT.SOIL_Y + Math.pow(dome, 1.35)*0.0340 - Math.pow(sat(rr),3.0)*0.0030
       + (fbm3(x*38, 3.3, z*38, 3)-0.5)*0.0035;
}
function inSoil(x,z){ return (x/(POT.A*0.935))**2 + (z/(POT.B*0.935))**2 < 1.0; }

function buildSoilBed(){
  const NX=54, NZ=38;
  const pos=[],nrm=[],uv=[],ex=[],idx=[];
  const se=[0,0];
  for (let j=0;j<=NZ;j++){
    const v=j/NZ;
    for (let i=0;i<=NX;i++){
      const u=i/NX;
      // polar-ish grid matching the superellipse rim
      const th=u*TAU; superEllipse(th, 2.0, se);
      const rr=v;
      const x=se[0]*POT.A*0.938*rr, z=se[1]*POT.B*0.938*rr;
      const y=soilHeight(x,z) - (1.0-rr)*0.0;
      pos.push(x,y,z);
      uv.push(x*7.0, z*7.0);
      nrm.push(0,1,0);
      // moss covers the whole bed: thickest at the rim and the nebari,
      // but never bare in between
      let moss = 0.55 + smooth(0.72, 0.99, rr)*0.42;
      const dn = Math.hypot(x-TREE_OFF_X, z-TREE_OFF_Z);
      moss = Math.max(moss, smooth(0.085, 0.026, dn)*0.95);
      moss *= sat(0.55 + fbm3(x*26+7, 1.7, z*26+3, 4)*1.2);
      ex.push(sat(0.55 + rr*0.55), 0.0, sat(moss), 0.0);
    }
  }
  for (let j=0;j<NZ;j++) for (let i=0;i<NX;i++){
    const a=j*(NX+1)+i, b=a+1, c=(j+1)*(NX+1)+i, d=c+1;
    idx.push(a,c,b, b,c,d);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pos),3));
  g.setAttribute('uv',       new THREE.BufferAttribute(new Float32Array(uv),2));
  g.setAttribute('aExtra',   new THREE.BufferAttribute(new Float32Array(ex),4));
  g.setIndex(new THREE.BufferAttribute(new Uint32Array(idx),1));
  g.computeVertexNormals();
  const mat = makeStdMaterial('SOIL', {
    map: TEX.soil, rough: 0.88,
    tint:  new THREE.Vector3(0.72,0.66,0.60),
    tint2: new THREE.Vector3(0.205,0.305,0.100),
    uvx:1.0, uvy:1.0, aoStrength: 0.85
  });
  const m = new THREE.Mesh(g, mat);
  m.userData.depthMaterial = staticDepthMaterial(false);
  m.name='soil';
  return m;
}

function buildGranules(){
  /* river pebbles — smooth, rounded, warm: the bed should read as a sowing of
     pebbles through the moss, not as a pile of akadama crumbs */
  const base = new THREE.IcosahedronGeometry(1.0, 1);
  const p = base.attributes.position;
  const arr = p.array;
  for (let i=0;i<p.count;i++){
    const x=arr[i*3],y=arr[i*3+1],z=arr[i*3+2];
    const k = 0.90 + 0.20*hash3i(Math.round(x*97),Math.round(y*97),Math.round(z*97));
    arr[i*3]*=k; arr[i*3+1]*=k*0.86; arr[i*3+2]*=k;
  }
  base.computeVertexNormals();
  const g = new THREE.InstancedBufferGeometry();
  if (base.index) g.index = base.index;      // polyhedra come back non-indexed
  g.setAttribute('position', base.attributes.position);
  g.setAttribute('normal',   base.attributes.normal);
  g.setAttribute('uv',       base.attributes.uv);
  g.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 1.4);

  const R = makeRand(31337);
  const N = CFG.granules;
  const mesh = new THREE.InstancedMesh(g, null, N);
  mesh.frustumCulled = false;
  const ext = new Float32Array(N*4);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(),
        e = new THREE.Euler(), s = new THREE.Vector3(), pv = new THREE.Vector3();
  const aka=[0,0,0], aka2=[0,0,0], pum=[0,0,0], tan=[0,0,0], kir=[0,0,0];
  hexToLinear(0x9a6a4e, aka); hexToLinear(0x7b5440, aka2);
  hexToLinear(0xd9d4c8, pum); hexToLinear(0xbfae94, tan); hexToLinear(0x837f74, kir);
  let placed=0, guard=0;
  while (placed < N && guard < N*22){
    guard++;
    const th=R.range(0,TAU), rr=Math.sqrt(R());
    const se=[0,0]; superEllipse(th,2.0,se);
    const x=se[0]*POT.A*0.918*rr, z=se[1]*POT.B*0.918*rr;
    if (!inSoil(x,z)) continue;
    // keep clear of the trunk footprint
    if (Math.hypot(x-TREE_OFF_X, z-TREE_OFF_Z) < 0.034) continue;
    const scale = R.range(0.0038, 0.0098) * (R.chance(0.10)? 1.45 : 1.0);
    const y = soilHeight(x,z) + scale*R.range(0.02, 0.35);
    pv.set(x,y,z);
    e.set(R.range(-0.4,0.4), R.range(0,TAU), R.range(-0.4,0.4));
    q.setFromEuler(e);
    s.set(scale*R.range(0.88,1.30), scale*R.range(0.55,0.80), scale*R.range(0.88,1.30));
    m.compose(pv,q,s);
    mesh.setMatrixAt(placed, m);
    const t=R();
    let c;
    if (t<0.40) c=pum; else if (t<0.60) c=tan; else if (t<0.84) c=kir;
    else if (t<0.95) c=aka; else c=aka2;
    const jit = R.range(0.82,1.24);
    ext[placed*4+0]=c[0]*jit; ext[placed*4+1]=c[1]*jit; ext[placed*4+2]=c[2]*jit;
    ext[placed*4+3]=R();
    placed++;
  }
  mesh.count = placed;
  mesh.instanceMatrix.needsUpdate = true;
  g.setAttribute('aExtra', new THREE.InstancedBufferAttribute(ext,4));
  mesh.material = makeStdMaterial('GRANULE', { rough: 0.52, instanced: true });
  mesh.userData.depthMaterial = staticDepthMaterial(true);
  mesh.name='granules';
  TREE.stats.granules = placed;
  TREE.stats.granuleTris = placed *
    ((base.index ? base.index.count : base.attributes.position.count)/3);
  return mesh;
}

function buildMossTufts(){
  const pos=[],nrm=[],uv=[],idx=[];
  const H=0.0072, W=0.0060;
  for (let q=0;q<3;q++){
    const a=q*Math.PI/3.0 + 0.3;
    const sx=Math.cos(a), sz=Math.sin(a);
    const b=pos.length/3;
    pos.push(-sx*W,0,-sz*W,  sx*W,0,sz*W,  -sx*W,H,-sz*W,  sx*W,H,sz*W);
    for(let k=0;k<4;k++) nrm.push(-sz,0.55,sx);
    uv.push(0,0, 1,0, 0,1, 1,1);
    idx.push(b,b+1,b+2, b+1,b+3,b+2);
  }
  const g=new THREE.InstancedBufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pos),3));
  g.setAttribute('normal',   new THREE.BufferAttribute(new Float32Array(nrm),3));
  g.setAttribute('uv',       new THREE.BufferAttribute(new Float32Array(uv),2));
  g.setIndex(new THREE.BufferAttribute(new Uint16Array(idx),1));
  g.boundingSphere = new THREE.Sphere(new THREE.Vector3(0,H*0.5,0), 0.012);

  const R=makeRand(6060);
  const N=CFG.mossTufts;
  const mesh=new THREE.InstancedMesh(g,null,N);
  mesh.frustumCulled=false;
  const ext=new Float32Array(N*4);
  const m=new THREE.Matrix4(),qt=new THREE.Quaternion(),e=new THREE.Euler(),
        s=new THREE.Vector3(),pv=new THREE.Vector3();
  let placed=0, guard=0;
  while(placed<N && guard<N*22){
    guard++;
