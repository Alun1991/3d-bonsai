   SECTION 14 — INTERFACE
   Ma first. The default state is the diorama and one thin rail. Panels arrive
   from the edge like fusuma, one at a time, and decelerate into place. Sumi,
   washi, three greys. Vermilion appears exactly once, on the active state.
   ========================================================================= */

const UI = {
  rail:null, panel:null, inner:null, open:null,
  items:[], toastT:0, photo:false, booted:false,
  lightPresets:{ asa:true, hiru:true, yugure:false, yoru:false }
};

const RAIL_ITEMS = [
  { id:'toki',   k:'時', r:'toki'   },
  { id:'hikari', k:'光', r:'hikari' },
  { id:'kei',    k:'景', r:'kei'    },
  { id:'kaze',   k:'風', r:'kaze'   },
  { id:'hana',   k:'葉', r:'ha'   },
  { id:'oto',    k:'音', r:'oto'    },
  { id:'satsu',  k:'撮', r:'satsu'  }
];

function el(tag, cls, html){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}

/* ---- hairline slider: a rule and a tick. no track fill, no pill. -------- */
function mkSlider(kanji, romaji, min, max, val, fmt, onChange){
  const wrap = el('div','ctl');
  const lab  = el('div','lab');
  const n = el('span','n', '<em>'+kanji+'</em>'+romaji);
  const v = el('span','v', fmt(val));
  lab.appendChild(n); lab.appendChild(v);
  const tr = el('div','track');
  const fill = el('div','fill');
  const knob = el('div','knob');
  const ends = el('div','ends'); ends.appendChild(el('i','a')); ends.appendChild(el('i','b'));
  tr.appendChild(ends); tr.appendChild(fill); tr.appendChild(knob);
  wrap.appendChild(lab); wrap.appendChild(tr);

  let cur = val;
  const set = (x, fire) => {
    cur = clamp(x, min, max);
    const t = (cur-min)/(max-min);
    knob.style.left = (t*100)+'%';
    fill.style.width = (t*100)+'%';
    v.textContent = fmt(cur);
    if (fire !== false) onChange(cur);
  };
  set(val, false);
  let dragging = false;
  const fromEvent = (e) => {
    const b = tr.getBoundingClientRect();
    const t = clamp((e.clientX - b.left)/Math.max(b.width,1), 0, 1);
    set(min + t*(max-min));
  };
  tr.addEventListener('pointerdown', e => {
    dragging = true; tr.classList.add('drag');
    tr.setPointerCapture(e.pointerId); fromEvent(e); e.preventDefault();
  });
  tr.addEventListener('pointermove', e => { if (dragging) fromEvent(e); });
  const end = e => { dragging=false; tr.classList.remove('drag');
    try{ tr.releasePointerCapture(e.pointerId); }catch(_){} };
  tr.addEventListener('pointerup', end);
  tr.addEventListener('pointercancel', end);
  return { node: wrap, set: (x)=>set(x,false), get: ()=>cur };
}

function mkOptions(opts, active, onPick){
  const row = el('div','opts');
  const btns = [];
  opts.forEach((o,i)=>{
    const b = el('button','opt');
    b.appendChild(el('span','tick'));
    b.appendChild(el('span','k', o.k));
    b.appendChild(el('span','r', o.r));
    b.addEventListener('click', ()=>{
      btns.forEach(x=>x.classList.remove('on'));
      b.classList.add('on'); onPick(i);
    });
    if (i===active) b.classList.add('on');
    row.appendChild(b); btns.push(b);
  });
  return { node: row, select:(i)=>{ btns.forEach((x,j)=>x.classList.toggle('on', j===i)); } };
}

function mkToggle(kanji, romaji, on, onChange){
  const b = el('button','tog'+(on?' on':''));
  b.setAttribute('role','switch');
  b.setAttribute('aria-checked', String(!!on));
  b.appendChild(el('span','n','<em>'+kanji+'</em>'+romaji));
  const right = el('span','togr');
  const st = el('span','st', on ? '入' : '切');   // the pair a Japanese switch uses
  const sw = el('span','sw'); sw.appendChild(el('i'));
  right.appendChild(st); right.appendChild(sw);
  b.appendChild(right);
  const paint = (v) => {
    b.classList.toggle('on', v);
    b.setAttribute('aria-checked', String(!!v));
    st.textContent = v ? '入' : '切';
  };
  b.addEventListener('click', ()=>{
    const next = !b.classList.contains('on');
    if (onChange(next) !== false) paint(next);
  });
  return { node:b, set:paint };
}

function mkAction(kanji, romaji, fn){
  const b = el('button','act','<em>'+kanji+'</em>'+romaji);
  b.addEventListener('click', fn);
  return { node:b };
}

/* ---- panels -------------------------------------------------------------- */
function buildPanel(id, APP){
  const f = document.createDocumentFragment();
  const head = el('div','phead');
  const meta = {
    toki:  ['時','toki',  '一日の光。移り変わりは二秒。'],
    hikari:['光','hikari','露出は測光から解いている。'],
    kei:   ['景','kei',   '九十粍。絞りは被写界深度に効く。切ることもできる。'],
    kaze:  ['風','kaze',  '室内の空気。天気ではない。'],
    hana:  ['葉','ha',  '黒松。針は四季を保つ。'],

/* --------------------------------------------------------------------------
   INPUT
   -------------------------------------------------------------------------- */
function bindInput(canvas, APP){
  let down = false, moved = 0, lx=0, ly=0, pressT=0, pid=-1;
  let pointers = new Map(), lastPinch = 0, longTimer = 0;

  const norm = (e) => {
    const r = canvas.getBoundingClientRect();
    return [ ((e.clientX-r.left)/r.width)*2-1, -(((e.clientY-r.top)/r.height)*2-1) ];
  };

  canvas.addEventListener('pointerdown', e=>{
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if (pointers.size === 1){
      down = true; moved = 0; lx=e.clientX; ly=e.clientY; pressT=performance.now(); pid=e.pointerId;
      clearTimeout(longTimer);
      longTimer = setTimeout(()=>{ if (down && moved < 8) APP.setPhoto(!UI.photo); }, 620);
    }
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', e=>{
    if (!pointers.has(e.pointerId)) return;
    const p = pointers.get(e.pointerId);
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    if (pointers.size >= 2){
      const it = pointers.values();
      const a = it.next().value, b = it.next().value;
      const dist = Math.hypot(a.x-b.x, a.y-b.y);
      if (lastPinch > 0) rigDolly((lastPinch - dist)*1.6);
      lastPinch = dist;
      rigPan(dx/Math.max(canvas.clientWidth,1)*0.5, dy/Math.max(canvas.clientHeight,1)*0.5);
      moved += 99;
      return;
    }
    if (!down) return;
    moved += Math.abs(dx)+Math.abs(dy);
    if (moved > 8) clearTimeout(longTimer);
    if (e.shiftKey) rigPan(dx/Math.max(canvas.clientWidth,1), dy/Math.max(canvas.clientHeight,1));
    else rigOrbit(dx*0.0042, dy*0.0030);
  });
  const up = e=>{
    clearTimeout(longTimer);
    pointers.delete(e.pointerId);
    if (pointers.size < 2) lastPinch = 0;
    if (e.pointerId === pid){
      if (down && moved < 8 && performance.now()-pressT < 600){
        const n = norm(e);
        const d = rigFocusAt(n[0], n[1], APP.camera);
        APP.toast('focus · '+(d*100).toFixed(0)+' cm', 1800);
      }
      down = false;
    }
    try{ canvas.releasePointerCapture(e.pointerId); }catch(_){}
  };
  canvas.addEventListener('pointerup', up);
  canvas.addEventListener('pointercancel', up);
  canvas.addEventListener('wheel', e=>{ e.preventDefault(); rigDolly(e.deltaY*0.9); }, {passive:false});
  canvas.addEventListener('pointerdown', ()=>seqInterrupt());
  canvas.addEventListener('contextmenu', e=>e.preventDefault());

  window.addEventListener('keydown', e=>{
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k !== 'escape') seqInterrupt();
    if (k === 'f'){ APP.setPhoto(!UI.photo); }
    else if (k === 'r'){ APP.resetView(); }
    else if (k === ' '){ e.preventDefault(); rigRackPreset(APP.camera); }
    else if (k === 'm'){ const on=!AUDIO.on; if(audioSetOn(on) && APP.audioToggle) APP.audioToggle.set(on); }
    else if (k === 'd'){ APP.setDof(!APP.post.dof); }
    else if (k === 'escape'){ if (UI.photo) APP.setPhoto(false); else UI.openPanel(null, APP); }
    else if (k >= '1' && k <= '4'){ APP.setPreset(parseInt(k,10)-1); }
  });
}

/* --------------------------------------------------------------------------
   BOOT — one sumi stroke, drawn once, at the speed the scene actually loads.
   No spinner, no percentage.
   -------------------------------------------------------------------------- */
function makeBootStroke(){
  const cv = document.getElementById('bootc');
  if (!cv) return { set(){}, done(){} };
  const g = cv.getContext('2d');
  const S = cv.width;
  g.clearRect(0,0,S,S);

  const CP = [[0.60,0.13],[0.545,0.28],[0.455,0.42],[0.415,0.545],[0.455,0.645],[0.375,0.735],[0.275,0.80]];
  const N = 460, SP = [];
  for (let i=0;i<N;i++){
    const t = i/(N-1);
    const f = t*(CP.length-1); let i0=Math.floor(f); if(i0>CP.length-2) i0=CP.length-2;
    const lt=f-i0;
    const a=CP[Math.max(0,i0-1)],b=CP[i0],c=CP[i0+1],d=CP[Math.min(CP.length-1,i0+2)];
    const px=0.5*((2*b[0])+(-a[0]+c[0])*lt+(2*a[0]-5*b[0]+4*c[0]-d[0])*lt*lt+(-a[0]+3*b[0]-3*c[0]+d[0])*lt*lt*lt);
    const py=0.5*((2*b[1])+(-a[1]+c[1])*lt+(2*a[1]-5*b[1]+4*c[1]-d[1])*lt*lt+(-a[1]+3*b[1]-3*c[1]+d[1])*lt*lt*lt);
    let w = 0.011 + 0.0345*Math.sin(Math.pow(t,0.70)*Math.PI*0.94);
    w *= 1.0 - Math.pow(sat((t-0.70)/0.30), 1.4)*0.76;
    SP.push([px*S, py*S, w*S, t]);
  }
  let drawn = 0;
  return {
    set(p){
      const target = Math.floor(sat(p)*(N-1));
      for (let i=drawn; i<=target; i++){
        const s = SP[i];
        const r = Math.max(0.6, s[2]);
        const dry = sat((s[3]-0.55)/0.45);
        const steps = Math.max(3, Math.round(r*0.9));
        for (let k=0;k<steps;k++){
          const ang = (k/steps)*Math.PI*2 + i*0.7;
          const rr = r*Math.sqrt((k+0.4)/steps);
          const nx = s[0] + Math.cos(ang)*rr*0.62;
          const ny = s[1] + Math.sin(ang)*rr*0.62;
          const streak = pfbm2(nx*0.09, ny*0.09, 64, 64, 3);
          let a = 0.20*(1.0 - rr/(r+1e-3)*0.55);
          a *= 1.0 - dry*sat((streak-0.36)*2.6)*1.25;
          a *= 1.0 - Math.pow(sat((s[3]-0.90)/0.10), 1.4)*0.9;
          if (a <= 0.002) continue;
          g.fillStyle = 'rgba(24,22,18,'+a.toFixed(3)+')';
          g.beginPath();
          g.arc(nx, ny, Math.max(0.5, r*0.42), 0, 6.283185);
          g.fill();
        }
      }
      drawn = Math.max(drawn, target+1);
    },
    done(){
      this.set(1.0);
      const b = document.getElementById('boot');
      b.classList.add('w');
      setTimeout(()=>{
        b.classList.add('gone');
        document.body.classList.remove('booting');
        setTimeout(()=>{ b.style.display='none'; }, 1200);
      }, 620);
    }
  };
}

/* --------------------------------------------------------------------------
   SHADOW PASS — proxies share geometry and instance buffers with the real
   meshes, so the depth pass costs one extra draw per caster and no memory.
   -------------------------------------------------------------------------- */
function makeShadowProxy(mesh){
  if (!mesh.userData.depthMaterial || mesh.userData.noShadow) return null;
  let p;
  if (mesh.isInstancedMesh){
    p = new THREE.InstancedMesh(mesh.geometry, mesh.userData.depthMaterial, mesh.count);
    p.instanceMatrix = mesh.instanceMatrix;
    p.count = mesh.count;
  } else {
    p = new THREE.Mesh(mesh.geometry, mesh.userData.depthMaterial);
  }
  p.frustumCulled = mesh.frustumCulled;
  mesh.updateWorldMatrix(true, false);
  p.matrixAutoUpdate = false;
  p.matrix.copy(mesh.matrixWorld);
  p.matrixWorld.copy(mesh.matrixWorld);
  p.userData.src = mesh;
  return p;
}
function collectShadowProxies(root, out){
  root.traverse(o => {
    if (!o.isMesh) return;
    const p = makeShadowProxy(o);
    if (p) out.add(p);
  });
}

function setupShadowCamera(){
  const rectC = LU.uRectC.value;
  const L = SCENE_CENTER.clone().sub(rectC).normalize();
  const half = 0.56, near = 0.02, far = 3.2;
  const cam = new THREE.OrthographicCamera(-half, half, half, -half, near, far);
  cam.position.copy(SCENE_CENTER).addScaledVector(L, -1.55);
  cam.up.set(0,1,0);
  cam.lookAt(SCENE_CENTER);
  cam.updateMatrixWorld(true);
  cam.updateProjectionMatrix();
  const bias = new THREE.Matrix4().set(
    0.5,0,0,0.5,  0,0.5,0,0.5,  0,0,0.5,0.5,  0,0,0,1);
  const m = new THREE.Matrix4().multiplyMatrices(cam.projectionMatrix, cam.matrixWorldInverse);
  LU.uShadowMat.value.multiplyMatrices(bias, m);
  LU.uShadowRange.value = far - near;
  LU.uShadowExtent.value = half;
  LU.uLightDist.value = 1.55;
  LU.uShadowTexel.value.set(1/CFG.shadowRes, 1/CFG.shadowRes);
  LU.uMaxPenUV.value = 0.026;
  return cam;
}

/* --------------------------------------------------------------------------
   LIGHTING APPLICATION AND CROSS-FADE
   -------------------------------------------------------------------------- */
const _shTmp = new Float32Array(27);
function applyLightState(a, b, t){
  const sh = LU.uSH.value;
  for (let i=0;i<9;i++){
    const x = lerp(a.sh[i*3+0], b.sh[i*3+0], t) * APP.ambTrim;
    const y = lerp(a.sh[i*3+1], b.sh[i*3+1], t) * APP.ambTrim;
    const z = lerp(a.sh[i*3+2], b.sh[i*3+2], t) * APP.ambTrim;
    sh[i].set(x,y,z);
  }
  LU.uKeyRad.value.set(
    lerp(a.keyRadiance[0], b.keyRadiance[0], t),
    lerp(a.keyRadiance[1], b.keyRadiance[1], t),
    lerp(a.keyRadiance[2], b.keyRadiance[2], t));
  LU.uEnvCube.value  = a.cube;
  LU.uEnvCubeB.value = b.cube;
  LU.uEnvScale.value  = a.cubeScale;
  LU.uEnvScaleB.value = b.cubeScale;
  LU.uEnvMix.value = t;
  const prac = APP.lanternForce === null
    ? lerp(a.practical, b.practical, t)
    : (APP.lanternForce ? 1.0 : 0.0);
  LU.uPracPower.value = prac * 0.185;
  LU.uPracCol.value.set(PRACTICAL_COL[0], PRACTICAL_COL[1], PRACTICAL_COL[2]);

  const exposure = lerp(a.exposure, b.exposure, t) * Math.pow(2.0, APP.evTrim);
  APP.post.U.exposure.value = exposure;

  // the shoji's own rendered radiance is the key light's radiance. one number.
  if (APP.shojiMat){
    const k = LU.uKeyRad.value;
    APP.shojiMat.uniforms.uEmissive.value.set(k.x, k.y, k.z);
  }
  if (APP.andonMat){
    const p = prac;
    APP.andonMat.uniforms.uEmissive.value.set(
      p*1.55*PRACTICAL_COL[0], p*1.55*PRACTICAL_COL[1], p*1.55*PRACTICAL_COL[2]);
  }
  APP.shadowDirty = true;
}
function applyExposure(){
  const f = APP.fade;
  const a = LIGHTING.states[f ? f.from : APP.presetIdx];
  const b = LIGHTING.states[f ? f.to : APP.presetIdx];
  const t = f ? f.t : 1.0;
  APP.post.U.exposure.value = lerp(a.exposure, b.exposure, t) * Math.pow(2.0, APP.evTrim);
}
APP.applyExposure = applyExposure;
APP.applySH = function(){
  const f = APP.fade;
  applyLightState(LIGHTING.states[f?f.from:APP.presetIdx],
                  LIGHTING.states[f?f.to:APP.presetIdx], f?f.t:1.0);
};
APP.setPreset = function(i){
  i = clamp(i|0, 0, PRESETS.length-1);
  if (i === APP.presetIdx && !APP.fade) return;
  APP.fade = { from: APP.presetIdx, to: i, t: 0, dur: 2.0 };
  APP.presetIdx = i;
  if (APP.presetOpts) APP.presetOpts.select(i);

};

  APP.lanternForce = !cur;

};
APP.setDof = function(on){

APP.sweepPetals = function(){

/* --------------------------------------------------------------------------
   RESIZE
   -------------------------------------------------------------------------- */
APP.resize = function(force){
  // The listener is attached before the renderer and post chain are built, so
  // that no viewport change between boot and first frame is missed. That means
  // a resize can legitimately arrive with nothing yet to size — and on a phone
  // it routinely does, because the URL bar collapses during the load.
  if (!APP.renderer || !APP.post) return;
  const canvas = APP.renderer.domElement;
  const w = Math.max(1, Math.floor(IS_NODE ? 1600 : window.innerWidth));
  const h = Math.max(1, Math.floor(IS_NODE ? 900  : window.innerHeight));
  const dpr = Math.min(IS_NODE ? 1 : (window.devicePixelRatio || 1), CFG.dprCap);
  const q = (CFG.mobile ? QUALITY_MOBILE : QUALITY)[APP.qLevel];
  let rw = Math.round(w*dpr*q.scale), rh = Math.round(h*dpr*q.scale);
  const px = rw*rh;
  if (px > CFG.pixelCap){
    const k = Math.sqrt(CFG.pixelCap/px);
    rw = Math.round(rw*k); rh = Math.round(rh*k);
  }
  if (!force && APP.cssW === w && APP.cssH === h && APP.post.size.x === rw && APP.post.size.y === rh) return;
  APP.cssW = w; APP.cssH = h; APP.dpr = dpr;
  if (canvas && canvas.style){ canvas.style.width = w+'px'; canvas.style.height = h+'px'; }
  APP.renderer.setPixelRatio(1);
  APP.renderer.setSize(rw, rh, false);
  APP.post.setSize(rw, rh);
  rigApply(APP.camera, w/h);
};

/* --------------------------------------------------------------------------
   FRAME
   -------------------------------------------------------------------------- */
function renderShadow(){
  const r = APP.renderer;
  r.setRenderTarget(APP.post.shadowRT);
  r.setClearColor(0xffffff, 1.0);
  r.clear(true, true, false);
  r.render(APP.shadowScene, APP.lightCam);
  r.setClearColor(0x000000, 1.0);
  LU.uShadowMap.value = APP.post.shadowRT.texture;
}

function frame(now){
  requestAnimationFrame(frame);
  if (!APP.ready) return;
  const nowS = now * 0.001;
  const dt = APP.last ? Math.min(nowS - APP.last, 0.05) : 0.016;
  APP.last = nowS;
  stepFrame(dt);
}

function stepFrame(dt){
  APP.t += dt;
  LU.uTime.value = APP.t;

  // preset cross-fade — two seconds, never a cut
  if (APP.fade){
    APP.fade.t = Math.min(1.0, APP.fade.t + dt/APP.fade.dur);
    const e = smoothi(APP.fade.t);
    applyLightState(LIGHTING.states[APP.fade.from], LIGHTING.states[APP.fade.to], e);
    if (APP.fade.t >= 1.0){ APP.fade = null; APP.applySH(); }
  }

  seqUpdate(dt);
  rigUpdate(APP.camera, dt, false);
  APP.post.U.lens.value.set(RIG.focal, RIG.fnum, RIG.focus, SENSOR_H);
  // a real iris: round wide open, hexagonal stopped down
  APP.post.mDofGather.uniforms.uIris.value.z = smooth(2.9, 7.5, RIG.fnum);
  // the gather radius is the lens's own far-field circle of confusion, so
  // stopping down genuinely shrinks the bokeh instead of only dimming it
  const S1mm = Math.max(RIG.focus*1000.0, RIG.focal + 1.0);
  const cocFarPx = (RIG.focal*RIG.focal / (RIG.fnum * (S1mm - RIG.focal)))
                 * 0.5 / SENSOR_H * APP.post.size.y;
  APP.post.mDofGather.uniforms.uIris.value.w = clamp(cocFarPx*0.5, 2.5, 20.0);

  // petals
  APP.fallAcc += dt * APP.fallRate;
  while (APP.fallAcc >= 1.0){
    APP.fallAcc -= 1.0;
    if (APP.blossoms && APP.blossoms.count > 0)
      releasePetal(APP.petals, APP.blossoms, APP.blossoms.count, APP.treeGroup.matrixWorld, APP.rnd, APP.t);
  }
  updatePetals(APP.petals, dt, APP.t);

  audioTick(APP.t, dt, LU.uBreath.value, CANOPY_POINT);

  if (APP.shadowDirty || (APP.frames & 1) === 0){
    renderShadow();
    APP.shadowDirty = false;
  }

  drawFrame();

  // governor
  APP.dtHist[APP.dtIdx++ % APP.dtHist.length] = dt;
  APP.frames++;
  if ((APP.frames % 30) === 0){
    const a = Array.prototype.slice.call(APP.dtHist).filter(x=>x>0).sort((p,q)=>p-q);
    const med = a.length ? a[a.length>>1] : 0.016;
    APP.fps = 1.0/Math.max(med, 1e-4);
    APP.govCool -= 0.5;
    const table = CFG.mobile ? QUALITY_MOBILE : QUALITY;
    // a single slow half-second is a camera move, not a verdict on the machine
    APP.govBad  = med > 1/52 ? APP.govBad + 1 : 0;
    APP.govGood = med < 1/78 ? APP.govGood + 1 : 0;
    if (APP.govCool <= 0){
      if (APP.govBad >= 2 && APP.qLevel < table.length-1){
        setQuality(APP.qLevel+1); APP.govCool = 3.0; APP.govBad = 0;
      } else if (APP.govGood >= 4 && APP.qLevel > 0){
        setQuality(APP.qLevel-1); APP.govCool = 8.0; APP.govGood = 0;
      }
    }
    updateStat();
  }
}

function drawFrame(){
  const r = APP.renderer;
  r.info.reset();
  r.setRenderTarget(APP.post.sceneRT);
  r.clear(true, true, false);
  r.render(APP.scene, APP.camera);
  APP.drawCalls = r.info.render.calls;
  APP.triangles = r.info.render.triangles;
  APP.post.mComposite.uniforms.uTimeSeed.value = (APP.frames % 64) * 7.13;
  APP.post.run();
  APP.totalCalls = r.info.render.calls;
}

function setQuality(l){
  const table = CFG.mobile ? QUALITY_MOBILE : QUALITY;
  APP.qLevel = clamp(l, 0, table.length-1);
  const q = table[APP.qLevel];
  CFG.shadowRes = q.shadow;
  CFG.bloomLevels = q.bloom;
  CFG.dofTaps = q.dof;
  APP.post.setQuality();
  APP.resize(true);
  APP.shadowDirty = true;
  /* Assigning canvas.width clears the drawing buffer. The governor runs at the
     END of a frame, so without an immediate repaint the compositor presents
     that empty buffer and you get a black flash — reliably, every time the
     quality steps, which is exactly while you are panning or zooming. */
  if (APP.ready && APP.post && APP.lightCam){
    renderShadow();
    APP.shadowDirty = false;
    drawFrame();
  }
}

function updateStat(){
  if (IS_NODE) return;
  const s = document.getElementById('stat');
  if (!s) return;
  const P = APP.petals;
  const optics = APP.post.dof
    ? 'f/'+RIG.fnum.toFixed(1)+' &nbsp; '+Math.round(RIG.focal)+'MM &nbsp; FOCUS '+(RIG.focus*100).toFixed(0)+'CM'
    : Math.round(RIG.focal)+'MM &nbsp; DEEP FOCUS';
  s.innerHTML =
    Math.round(APP.fps)+' FPS &nbsp; '+APP.drawCalls+' DRAWS &nbsp; '+
    (APP.triangles/1000).toFixed(0)+'K TRI<br>'+
    APP.post.size.x+'×'+APP.post.size.y+' &nbsp; SHADOW '+CFG.shadowRes+' &nbsp; Q'+APP.qLevel+'<br>'+
    optics;
  const hc = document.getElementById('hanaCount');
  if (hc) hc.textContent = '針簇 '+TREE.stats.blossoms+'　'+P.landed+' 落針';
}

/* --------------------------------------------------------------------------
   STAGED BUILD — one step per frame so the ink stroke advances at the speed
   the scene is actually assembling.
   -------------------------------------------------------------------------- */
const CANOPY_POINT = new THREE.Vector3(0.05, 0.60, -0.30);

function assemble(canvas, renderer){
  renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
  renderer.toneMapping = THREE.NoToneMapping;
  renderer.setClearColor(0x000000, 1);
  renderer.shadowMap.enabled = false;
  renderer.debug.checkShaderErrors = false;
  APP.renderer = renderer;

  const scene = new THREE.Scene();
  const shadowScene = new THREE.Scene();
  APP.scene = scene; APP.shadowScene = shadowScene;
  const camera = new THREE.PerspectiveCamera(15.2, 1, NEAR, FAR);
  APP.camera = camera;

  const steps = [];
  steps.push(()=>{ buildBark(); });
  steps.push(()=>{ buildPetal(); buildStamen(); buildStamenTop(); });
  steps.push(()=>{ buildMoss(); buildLeaf(); });
  steps.push(()=>{ buildGlaze(); });
  steps.push(()=>{ buildClay(); });
  steps.push(()=>{ buildTatami(); buildShoji(); });
  steps.push(()=>{ buildWood(); });
  steps.push(()=>{ buildScroll(); });
  steps.push(()=>{ buildSoil(); buildWashiCSS(); });
  for (let i=0;i<PRESETS.length;i++){
    steps.push(()=>{
      const p = PRESETS[i];
      const Lm = solveRadiosity(p);
      const sh = projectSH(p, 24);
      const midL = measureMidLuminance(p, sh, Lm);
      let exposure = (0.155 * Math.pow(2.0, p.evBias)) / Math.max(midL, 1e-6);
      exposure = clamp(exposure, 0.02, 400.0);
      const scale = Math.max(Lm[0],Lm[1],Lm[2])*1.30 + 0.02;
      const faces = bakeCubeFaces(p, scale);
      LIGHTING.states.push({ preset:p, sh, keyRadiance:Lm, exposure, midL,
        cubeScale:scale, cubeFaces:faces, cube:makeCubeTexture(faces),
        practical:p.practical });
    });
  }
  steps.push(()=>{ LIGHTING.built = true; APP.post = createPost(renderer); });
  steps.push(()=>{ buildTree(20260318); });
  steps.push(()=>{
    const g = buildWoodGeometry();
    const grp = new THREE.Group();
    grp.position.set(SHOKU.x + TREE_OFF_X, TREE_BASE_Y + 0.0055, SHOKU.z + TREE_OFF_Z);
    grp.rotation.y = TREE_ROT_Y;
    grp.updateMatrixWorld(true);
    const wood = new THREE.Mesh(g, makeWoodMaterial());
    wood.userData.depthMaterial = makeWoodDepthMaterial();
    wood.frustumCulled = false;
    wood.name = 'wood';
    grp.add(wood);
    scene.add(grp);
    APP.treeGroup = grp;
  });
  steps.push(()=>{
    APP.blossoms = buildBlossoms();
    APP.treeGroup.add(APP.blossoms);
    const lv = buildLeaves();
    APP.treeGroup.add(lv);
    APP.treeGroup.updateMatrixWorld(true);
  });
  steps.push(()=>{
    const potG = new THREE.Group();
    potG.position.set(SHOKU.x, POT_Y + POT.FOOT, SHOKU.z);
    potG.add(buildPot());
    potG.add(buildPotFeet());
    potG.add(buildDrainage());
    scene.add(potG);
    APP.potGroup = potG;
  });
  steps.push(()=>{
    APP.potGroup.add(buildSoilBed());
    APP.potGroup.add(buildGranules());
  });
  steps.push(()=>{
    APP.potGroup.add(buildMossTufts());
    APP.potGroup.add(buildTieWire());
    APP.potGroup.add(buildStones());
    APP.potGroup.updateMatrixWorld(true);
  });
  steps.push(()=>{
    APP.room = buildRoom();
    scene.add(APP.room);
    APP.room.updateMatrixWorld(true);
    APP.room.traverse(o=>{
      if (o.name === 'shojiPaper') APP.shojiMat = o.material;
      if (o.name === 'andonShade') APP.andonMat = o.material;
    });
  });
  steps.push(()=>{
    APP.petals = buildPetalPool();
    seedFallenPetals(APP.petals, 0);
    scene.add(APP.petals.mesh);
    APP.petals.mesh.updateMatrixWorld(true);
  });
  steps.push(()=>{
    scene.updateMatrixWorld(true);
    collectShadowProxies(scene, shadowScene);
    APP.lightCam = setupShadowCamera();
    rigPadSpheres(APP.treeGroup.matrixWorld);
    applyLightState(LIGHTING.states[APP.presetIdx], LIGHTING.states[APP.presetIdx], 1.0);
    if (!IS_NODE){
      buildUI(APP);
      bindInput(canvas, APP);
      APP.setUiTheme(PRESETS[APP.presetIdx].id);
    }
    rigInit(camera);
    APP.resize(true);          // last, so the viewport has the final word
    APP.post.mComposite.uniforms.uGrain.value = APP.grain;
  });
  return steps;
}

function boot(){
  const canvas = document.getElementById('gl');
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({
      canvas, antialias:false, alpha:false, stencil:false, depth:true,
      powerPreference:'high-performance', preserveDrawingBuffer:false
    });
  } catch(e){
    document.getElementById('fatal').style.display='flex';
    document.getElementById('fatal').textContent='WEBGL2 が必要です — this piece needs WebGL2.';
    document.getElementById('boot').style.display='none';
    return;
  }
  const stroke = makeBootStroke();
  const steps = assemble(canvas, renderer);
  /* the build must finish even if the page was opened in a background tab,
     where requestAnimationFrame never fires at all */
  function nextTick(fn){
    let fired = false;
    const go = () => { if (fired) return; fired = true; fn(); };
    requestAnimationFrame(go);
    setTimeout(go, 64);
  }
  let si = 0;
  function step(){
    const t0 = performance.now();
    // in a hidden tab there is no stroke to animate and chained timers are
    // clamped to a second apiece, so just build the whole thing at once
    const hidden = !!document.hidden;
    while (si < steps.length && (hidden || performance.now() - t0 < 26)){
      try { steps[si](); } catch(err){
        console.error('build step '+si+' failed', err);
      }
      si++;
      stroke.set(si/steps.length * 0.97);
      if (!hidden && si <= 9) break;   // texture steps are heavy; one per frame
    }
    if (si < steps.length){ nextTick(step); return; }
    stroke.done();
    APP.ready = true;
    APP.last = 0;
    // the scene opens still: no auto sequence, no idle drift until touched
    requestAnimationFrame(frame);
  }
  window.addEventListener('resize', ()=>APP.resize(false));
  // iOS reports the pre-rotation size if you read it on the event itself
  window.addEventListener('orientationchange', ()=>{
    APP.resize(false);
    setTimeout(()=>APP.resize(true), 260);
  });
  nextTick(step);
}

if (!IS_NODE){
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
}

   SECTION 16 — HEADLESS TEST SURFACE
   Inert in a browser. When the module is evaluated outside a document (the
   offline validation harness), it exposes the builders and the shader sources
   so the static GLSL pass and the multi-thousand-frame simulation can run
   without a GPU.
   ========================================================================= */
if (IS_NODE) {
  globalThis.__SAKURA__ = {
    THREE, CFG, GL, LU, TEX, TREE, RIG, APP, POT, ROOM, SHOJI, SHOJI_Q,
    ALCOVE, SHOKU, PRESETS, LIGHTING, PATCHES, SCENE_CENTER, QUALITY,
    PETAL_STATE, POT_Y, TREE_BASE_Y, TREE_ROT_Y, TREE_OFF_X, TREE_OFF_Z,
    build: {
      bark: buildBark, petal: buildPetal, stamen: buildStamen, moss: buildMoss,
      stamenTop: buildStamenTop,
      glaze: buildGlaze, clay: buildClay, tatami: buildTatami, wood: buildWood,
      shoji: buildShoji, scroll: buildScroll, soil: buildSoil, leaf: buildLeaf,
      lighting: buildLighting, tree: buildTree, woodGeometry: buildWoodGeometry,
      blossoms: buildBlossoms, leaves: buildLeaves, pot: buildPot,
      potFeet: buildPotFeet, drainage: buildDrainage, soilBed: buildSoilBed,
      granules: buildGranules, mossTufts: buildMossTufts, tieWire: buildTieWire,
      room: buildRoom, petalPool: buildPetalPool, flowerGeometry: buildFlowerGeometry,
      woodMaterial: makeWoodMaterial, woodDepth: makeWoodDepthMaterial,
      stdMaterial: makeStdMaterial, post: createPost
    },
    sim: {
      seedFallenPetals, releasePetal, updatePetals, landingHeight,
      rigUpdate, rigApply, rigOrbit, rigDolly, rigFocusAt, rigRackPreset,
      SEQ, seqStart, seqStop, seqUpdate, seqInterrupt, seqBuild, seqPose,
      rigPadSpheres, applyLightState, setupShadowCamera, makeShadowProxy,
      assemble, stepFrame, setQuality, RIG_OBJ: RIG,
      collectShadowProxies, breathMagnitudeCPU, compToWeight,
      AUDIO, audioSetOn, audioPlay, audioLoad, audioMeasure,
      AUDIO_ASSETS, AUDIO_TARGET, AUDIO_LEVEL,
      rectFormFactor, projectSH, shIrradiance, envRadiance, solveRadiosity,
      measureMidLuminance, bakeCubeFaces, superEllipse, soilHeight, inSoil
    },
    shaders: {
      WOOD_VERT, WOOD_FRAG, DEPTH_VERT_WOOD, DEPTH_FRAG,
      FLOWER_VERT, FLOWER_FRAG, FLOWER_DEPTH_VERT, FLOWER_DEPTH_FRAG,
      STD_VERT, STD_FRAG, STATIC_DEPTH_VERT, STATIC_DEPTH_VERT_UV,
      STATIC_DEPTH_FRAG_CUT,
      FSQ_VERT: GL.FSQ_VERT,
      PASS_DOF_DOWN, PASS_DOF_GATHER, PASS_DOF_COMP, PASS_BRIGHT,
      PASS_DUAL_DOWN, PASS_DUAL_UP, PASS_COMPOSITE,
      SWAY: GL.SWAY
    }
  };
}
