<html lang="ja">
<head>

<title>床の間 — 黒松盆栽</title>

<!-- ============================================================= -->
<!-- STYLE : SUMI / WASHI / THREE GREYS / ONE VERMILION            -->
<!-- ============================================================= -->
<style>
  :root{
    --sumi:#191713;
    --sumi-soft:#2b2721;
    --washi:#efeadf;
    --washi-2:#e5dfd2;
    --g1:#a7a196;      /* light grey  */
    --g2:#7b756a;      /* mid grey    */
    --g3:#4c4840;      /* deep grey   */
    --shu:#c0392b;     /* vermilion. appears exactly once: active state */
    --hair:rgba(25,23,19,.16);
    --ease:cubic-bezier(.22,.61,.36,1);
    --jp:"Hiragino Mincho ProN","Hiragino Mincho Pro","Yu Mincho",YuMincho,"YuMincho","Noto Serif JP","Songti SC","Source Han Serif JP","MS Mincho",serif;
    --lat:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
     -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  html,body{height:100%;overflow:hidden;background:#0c0b0a}
  body{
    font-family:var(--lat);
    color:var(--sumi);
    -webkit-font-smoothing:antialiased;
    text-rendering:geometricPrecision;
  }
  canvas#gl{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;}

  /* ---------- generic ui shell ---------- */
  .ui{position:fixed;z-index:10;transition:opacity .7s var(--ease);}
  body.photo .ui{opacity:0;pointer-events:none;}
  body.booting .ui{opacity:0;pointer-events:none;}

  /* ---------- the rail : the only thing on screen by default ---------- */
  #rail{
    top:50%;right:0;transform:translateY(-50%);
    width:60px;
    display:flex;flex-direction:column;align-items:stretch;
    border-left:1px solid rgba(239,234,223,.20);
    background:transparent;
  }
  /* The rail floats over a photograph, so its own colour cannot be trusted to
     contrast with anything. Washi glyphs carry a sumi legibility halo — the
     same trick a map label uses, and invisible as an effect. */
  .ritem{
    position:relative;
    appearance:none;border:0;background:none;cursor:pointer;
    padding:14px 0 12px 0;
    display:flex;flex-direction:column;align-items:center;gap:4px;
    color:rgba(239,234,223,.86);
    text-shadow:0 0 7px rgba(18,16,13,.72), 0 1px 2px rgba(18,16,13,.55);
    transition:color .45s var(--ease);
    font-family:var(--jp);
  }
  .ritem:not(:last-child)::after{
    content:"";position:absolute;left:17px;right:17px;bottom:0;height:1px;
    background:rgba(239,234,223,0);
  }
  .ritem .k{font-size:16.5px;line-height:1;letter-spacing:.02em;}
  .ritem .r{
    font-family:var(--lat);font-size:8px;line-height:1;
    letter-spacing:.15em;text-transform:lowercase;
    color:rgba(239,234,223,.62);
    transition:color .45s var(--ease);
  }
  .ritem:hover{color:var(--washi)}
  .ritem:hover .r{color:rgba(239,234,223,.9)}
  /* the single accent: a 1px vermilion tick on the active item */
  .ritem .tick{
    position:absolute;left:0;top:50%;transform:translateY(-50%) scaleY(0);
    width:1px;height:20px;background:var(--shu);
    transition:transform .5s var(--ease);
    transform-origin:center;
  }
  .ritem[aria-expanded="true"] .tick,.ritem.on .tick{transform:translateY(-50%) scaleY(1);}
  .ritem[aria-expanded="true"],.ritem.on{color:var(--washi)}
  .ritem[aria-expanded="true"] .r,.ritem.on .r{color:rgba(239,234,223,.92)}

  /* ---------- fusuma panel ---------- */
  #panel{
    top:0;right:60px;height:100%;width:272px;
    transform:translateX(calc(100% + 60px));
    transition:transform .62s var(--ease);
    will-change:transform;
    background:var(--washi);
    background-repeat:repeat;
    display:flex;flex-direction:column;
    padding:0;
  }
  #panel.open{transform:translateX(0);}
  #panel::before{ /* deckle edge, generated. only exists while the panel is out */
    content:"";position:absolute;left:-9px;top:0;bottom:0;width:10px;
    background-repeat:repeat-y;background-position:right top;
    pointer-events:none;opacity:0;transition:opacity .4s var(--ease);
  }
  #panel.open::before{opacity:1}
  #panelInner{
    flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
    padding:44px 30px 30px 26px;
    display:flex;flex-direction:column;
  }
  .phead{display:flex;align-items:baseline;gap:9px;margin-bottom:30px;}
  .phead .k{font-family:var(--jp);font-size:19px;color:var(--sumi);letter-spacing:.06em;}
  .phead .r{font-size:9px;letter-spacing:.26em;color:var(--g2);text-transform:lowercase;}
  .pnote{font-size:10.5px;line-height:1.85;color:var(--g2);margin-bottom:26px;max-width:19em;}

  /* ---------- hairline control : a line and a tick. no pills. ---------- */
  .ctl{margin-bottom:27px;}
  .ctl .lab{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:11px;}
  .ctl .lab .n{font-size:9.5px;letter-spacing:.2em;color:var(--g3);text-transform:lowercase;}
  .ctl .lab .n em{font-family:var(--jp);font-style:normal;font-size:11.5px;letter-spacing:.04em;margin-right:7px;color:var(--sumi);}
  .ctl .lab .v{font-size:9.5px;letter-spacing:.1em;color:var(--g2);font-variant-numeric:tabular-nums;}
  .track{position:relative;height:15px;cursor:ew-resize;touch-action:none;}
  .track::before{content:"";position:absolute;left:0;right:0;top:7px;height:1px;background:rgba(25,23,19,.2);}
  .track .fill{position:absolute;left:0;top:7px;height:1px;background:rgba(25,23,19,.55);}
  .track .knob{position:absolute;top:3px;width:1px;height:9px;background:var(--sumi);transform:translateX(-.5px);transition:height .3s var(--ease),top .3s var(--ease);}
  .track:hover .knob,.track.drag .knob{height:15px;top:0;}
  .track .ends{position:absolute;left:0;right:0;top:7px;height:1px;}
  .track .ends i{position:absolute;top:-2px;width:1px;height:5px;background:rgba(25,23,19,.28);}
  .track .ends i.a{left:0}.track .ends i.b{right:0}

  /* ---------- option row ---------- */
  .opts{display:flex;gap:0;margin-bottom:30px;border-top:1px solid rgba(25,23,19,.14);}
  .opt{
    appearance:none;border:0;background:none;cursor:pointer;
    flex:1;padding:13px 0 11px;position:relative;
    display:flex;flex-direction:column;align-items:center;gap:4px;
    color:var(--g2);transition:color .45s var(--ease);
    font-family:var(--jp);
  }
  .opt .k{font-size:14px;line-height:1;}
  .opt .r{font-family:var(--lat);font-size:7.5px;letter-spacing:.16em;line-height:1;color:var(--g1);transition:color .45s var(--ease);}
  .opt:hover{color:var(--sumi)}
  .opt.on{color:var(--sumi)}
  .opt.on .r{color:var(--g2)}
  .opt .tick{position:absolute;left:50%;top:0;width:12px;height:1px;background:var(--shu);
    transform:translateX(-50%) scaleX(0);transition:transform .5s var(--ease);}
  .opt.on .tick{transform:translateX(-50%) scaleX(1);}

  /* ---------- toggle ----------
     A 1px rule with a tick that slides along it is a SLIDER. Using the same
     shape for a binary control is worse than being ugly — it tells you the
     wrong thing about what it does. A toggle gets a mark that is either
     filled or empty, and says which in words. */
  .tog{display:flex;align-items:center;justify-content:space-between;
       padding:14px 0;border-top:1px solid rgba(25,23,19,.14);cursor:pointer;
       appearance:none;border-left:0;border-right:0;border-bottom:0;background:none;width:100%;}
  .tog .n{font-size:9.5px;letter-spacing:.2em;color:var(--g3);text-transform:lowercase;}
  .tog .n em{font-family:var(--jp);font-style:normal;font-size:11.5px;letter-spacing:.04em;margin-right:7px;color:var(--sumi);}
  .tog .togr{display:flex;align-items:center;gap:10px;}
  .tog .st{font-family:var(--jp);font-size:11px;line-height:1;letter-spacing:.06em;
           color:var(--g1);transition:color .4s var(--ease);}
  .tog.on .st{color:var(--sumi);}
  .tog .sw{position:relative;width:12px;height:12px;flex:0 0 12px;
           border:1px solid rgba(25,23,19,.38);background:none;
           transition:border-color .4s var(--ease);}
  .tog .sw i{position:absolute;left:2px;top:2px;right:2px;bottom:2px;
             background:none;transition:background .4s var(--ease);}
  .tog:hover .sw{border-color:rgba(25,23,19,.62);}
  .tog.on .sw{border-color:var(--shu);}
  .tog.on .sw i{background:var(--shu);}

  .act{
    appearance:none;border:0;background:none;cursor:pointer;width:100%;text-align:left;
    padding:14px 0;border-top:1px solid rgba(25,23,19,.14);
    font-size:9.5px;letter-spacing:.2em;color:var(--g3);text-transform:lowercase;
    transition:color .4s var(--ease);
  }
  .act em{font-family:var(--jp);font-style:normal;font-size:11.5px;letter-spacing:.04em;margin-right:7px;color:var(--sumi);}
  .act:hover{color:var(--sumi)}

  .pfoot{margin-top:auto;padding-top:22px;font-size:8.5px;letter-spacing:.16em;color:var(--g1);line-height:2;}

  /* ---------- vertical writing group ---------- */
  #tate{
    left:26px;top:34px;
    writing-mode:vertical-rl;text-orientation:mixed;
    font-family:var(--jp);
    display:flex;align-items:flex-start;gap:16px;
    pointer-events:none;
  }
  #tate .t{font-size:13.5px;letter-spacing:.34em;color:rgba(239,234,223,.82);
    text-shadow:0 0 7px rgba(18,16,13,.7);}
  #tate .s{font-size:9px;letter-spacing:.42em;color:rgba(239,234,223,.45);
    text-shadow:0 0 6px rgba(18,16,13,.65);}

  /* ---------- readout : lower left, whisper ---------- */
  #stat{
    left:26px;bottom:24px;
    font-size:8.5px;letter-spacing:.17em;color:rgba(239,234,223,.46);
    text-shadow:0 0 6px rgba(18,16,13,.7);
    font-variant-numeric:tabular-nums;line-height:1.9;
    pointer-events:none;
    opacity:0;transition:opacity .6s var(--ease);
  }
  #stat.show{opacity:1}

  /* ---------- photo mode ---------- */
  /* No thirds grid and no reticle. Photo mode is the absence of interface,
     and a rule of thirds overlay is still interface. All that stays is the
     one glyph telling you where you are. */
  #guides{
    inset:0;pointer-events:none;opacity:0;z-index:9;
    transition:opacity .8s var(--ease);
  }
  body.photo #guides{opacity:1}
  #guides .mark{position:absolute;right:26px;bottom:24px;font-family:var(--jp);
    font-size:10px;letter-spacing:.36em;color:rgba(239,234,223,.42);
    text-shadow:0 0 7px rgba(18,16,13,.7)}

  /* ---------- ink loading ---------- */
  #boot{
    position:fixed;inset:0;z-index:40;background:var(--washi);
    display:flex;align-items:center;justify-content:center;
    transition:opacity 1.05s var(--ease);
  }
  #boot.gone{opacity:0;pointer-events:none}
  #bootc{display:block;width:200px;height:200px}
  #bootw{position:absolute;left:50%;bottom:calc(50% - 118px);transform:translateX(-50%);
    font-family:var(--jp);font-size:10px;letter-spacing:.5em;color:rgba(25,23,19,.28);
    opacity:0;transition:opacity 1.4s var(--ease) .5s;}
  #boot.w #bootw{opacity:1}

  /* ---------- toast : one line, no chrome ---------- */
  #toast{
    left:50%;bottom:34px;transform:translateX(-50%);
    font-size:9px;letter-spacing:.24em;color:rgba(239,234,223,.0);
    font-family:var(--lat);text-transform:lowercase;pointer-events:none;
    transition:color .5s var(--ease);white-space:nowrap;
  }
  #toast.show{color:rgba(239,234,223,.74);text-shadow:0 0 7px rgba(18,16,13,.7)}

  #fatal{position:fixed;inset:0;z-index:60;background:var(--washi);display:none;
    align-items:center;justify-content:center;padding:40px;text-align:center;
    font-size:11px;line-height:2;letter-spacing:.1em;color:var(--g3)}

  /* ---------- touch ----------
     A 15px rule is a fine mouse target and an impossible thumb target. On a
     coarse pointer every control grows to about 44px of hit area while the
     drawn hairline stays exactly the same width — the affordance changes,
     the design does not. */
  @media (pointer:coarse){
    .track{height:44px}
    .track::before,.track .fill,.track .ends{top:21px}
    .track .knob{top:15px;height:14px}
    .track:hover .knob,.track.drag .knob{top:10px;height:24px}
    /* padding maths does not guarantee a target size once the label's line
       box varies. state the minimum. */
    .opt{padding:15px 0 13px;min-height:48px;justify-content:center}
    .tog{padding:14px 0;min-height:48px}
    .act{padding:15px 0;min-height:48px;display:flex;align-items:center}
    .ritem{padding:16px 0 14px;min-height:48px;justify-content:center}
    .ctl{margin-bottom:22px}
    .ctl .lab .n,.ctl .lab .v,.tog .n,.act{font-size:11px}
    .pnote{font-size:11.5px}
  }

  @media (max-width:720px){
    #rail{width:56px;
      right:env(safe-area-inset-right,0px);}
    .ritem .k{font-size:16.5px}
    #panel{width:calc(100vw - 56px - env(safe-area-inset-right,0px));
      right:calc(56px + env(safe-area-inset-right,0px));}
    #panelInner{padding:calc(30px + env(safe-area-inset-top,0px)) 24px
                        calc(24px + env(safe-area-inset-bottom,0px)) 22px}
    #tate{top:calc(20px + env(safe-area-inset-top,0px));
      left:calc(16px + env(safe-area-inset-left,0px))}
    #stat{left:calc(16px + env(safe-area-inset-left,0px));
      bottom:calc(14px + env(safe-area-inset-bottom,0px))}
    #toast{bottom:calc(26px + env(safe-area-inset-bottom,0px))}
    #guides .mark{right:calc(20px + env(safe-area-inset-right,0px));
      bottom:calc(18px + env(safe-area-inset-bottom,0px))}
  }

  /* seven rail items at touch size need 400px of height, and a phone held
     sideways does not have it. tighten rather than overflow. */
  @media (max-height:560px){
    /* seven items at a 48px minimum need 336px of rail. a phone held
       sideways can be 320px tall. give back six pixels per item and let the
       rail scroll, so the count can never clip whatever the viewport does. */
    #rail{width:46px;overflow-y:auto;overscroll-behavior:contain;
          -webkit-overflow-scrolling:touch}
    .ritem{padding:7px 0 6px;gap:2px;min-height:42px}
    .ritem .k{font-size:14px}
    .ritem .r{font-size:6.5px;letter-spacing:.1em}
    .ritem .tick{height:15px}
    #panel{width:calc(100vw - 46px - env(safe-area-inset-right,0px));
      right:calc(46px + env(safe-area-inset-right,0px))}
    #panelInner{padding:20px 20px 18px 18px}
    #tate,#stat{display:none}
    .phead{margin-bottom:16px}
    .pnote{margin-bottom:14px}
    .ctl{margin-bottom:16px}
  }

  @media (max-width:400px){
    #tate .s{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    #panel{transition-duration:.001s}
    .ui{transition-duration:.001s}
  }
</style>
</head>

<div id="toast" class="ui"></div>

<aside id="panel" class="ui"><div id="panelInner"></div></aside>

<div id="boot"><canvas id="bootc" width="400" height="400"></canvas><div id="bootw"></div></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
